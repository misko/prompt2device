  source: TI SCPS221G Section 11.1 Layout Guidelines and Figure 13 Layout Example, PDF page 23; retained TCA9406-SCPS221G.pdf
  reviewed: 2026-09-23
  notes:
    - 'Place C_ADC_I2C_A by U_ADC_I2C_XLATE VCCA pin 3 and C_ADC_I2C_B by VCCB pin 7, with short ground returns to pin 2 and the ground plane. These are the selected 100 nF source capacitors corresponding to the two bypass capacitors in TI Figure 13.'
    - 'Keep both I2C-side traces short to limit capacitive loading and reflections; preserve OE low until both supplies are stable, as shown in Figure 13. Actual routed timing and placement remain to be checked on the native board.'
