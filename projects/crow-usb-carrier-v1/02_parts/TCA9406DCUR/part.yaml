gotchas:
  - 'Connect VCCA to XU IOR 1V8 and VCCB to quiet 3V3_ADC; OE may be driven directly from 3.3V ADC_READY because it is 5.5V tolerant.'
  - 'OE low or either supply off puts both I2C sides high impedance and avoids back-powering.'
  - 'Internal 10kohm pullups are complemented by four external 4.7kohm pullups for the board control bus.'
