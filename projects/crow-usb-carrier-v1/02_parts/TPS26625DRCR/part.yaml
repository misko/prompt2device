evidence_limits:
  - The 0.145/0.152/0.159A table row is characterized at 24V and VIN-VOUT=1V over the table temperature range. It is not claimed as a guaranteed 12V hard-short bound.
  - The 482uA maximum supply-current entry also uses the electrical table's 24V global condition; its eight-device sum is a planning screen, not a guaranteed 11.4-13.2V bound.
  - The 1.6A fast-trip threshold and 220ns response are typical behavior, not maximum transient guarantees.
  - The 512ms timing is nominal and depends on operating mode, CdVdT, voltage drop and thermal shutdown. No bounded common-bus disturbance is claimed.
  - Thermal shutdown time depends on exposed-pad copper and ambient. The candidate has no PCB or thermal proof.
  - TI's application section is explicitly not a component specification; system fault containment needs source, harness and first-article evidence.
layout:
  source: TI SLVSDT4F sections 10.4 and 11, Figures 11-1/11-2, and DRC0010J package drawing
  reviewed: '2026-09-22'
  notes:
    - Place C_SPOKE_INx directly between IN pin 1 and system GND pin 6 with the smallest practical loop; place C_SPOKE_OUTx directly between OUT pin 10 and system GND.
    - Keep R_SPOKE_ILIMx and C_SPOKE_DVDTx local to pins 7/8 and return them to the RTN island at pin 5, never to system GND.
    - Join exposed pad 11 to the RTN copper plane for heat spreading and retain an independent copper connection from pin 5 to that plane; the exposed pad is not the sole RTN connection.
    - Keep RTN and system GND electrically separate. Size RTN copper and thermal vias from the later overload/retry thermal analysis at 70 C rather than inheriting TI evaluation-board temperature performance.
