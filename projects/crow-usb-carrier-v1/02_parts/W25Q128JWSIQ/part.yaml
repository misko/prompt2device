boot_compatibility:
  controller_document: XMOS XU316/XU316-QF60B/XU316-QF128B Datasheet XM-014532-PC v2.0.0 section 9.1
  controller_document_sha256: a2ce2dc835df06793a4e1aa6c5d226c6a01c25c979a63b09a2b57059c17321cf
  protocol: 0xEB Quad I/O Read with three address bytes, one mode byte, then dummy clocks
  power_up: Device powers up in SPI mode; fixed-QE ordering option permits quad data pins without a status-register
    write.
  readiness: Winbond tVSL maximum is 20us; XU316 boot requires the device to be QSPI-access-ready within
    300us.
  addressability: 128Mbit is 16MiB and fits the XU316 ROM's 24-bit boot address range starting at address
    zero.
  clock_alignment: XMOS XTC Tools15.3 explicitly specifies six post-address clocks. Winbond RevH consumes
    two mode clocks plus four dummy clocks before data; this resolves the older XU316 one-dummy-byte shorthand.
  clock_alignment_source: https://www.xmos.com/documentation/XM-014363-PC/html/tools-guide/tools-ref/libraries/libquadflash-included-devices/libquadflash-devices.html
