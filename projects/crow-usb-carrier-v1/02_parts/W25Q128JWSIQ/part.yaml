gotchas:
- The selected Q suffix is load-bearing because XU316 ROM boot cannot first write a volatile QE setting.
- XU316 boots with EBh in SPI mode and requires the flash not to power up in QPI mode.
- Candidate has two dated public observations, but Q-2SOURCE remains pending until the project machine
  gate composes and passes the adopted inputs.
