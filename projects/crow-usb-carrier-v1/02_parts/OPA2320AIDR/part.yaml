  reviewed: '2026-09-09'
  notes:
    - ADR0025 board-specific bindings replace the retired bridge and buffered-reference circuit; manufacturer facts
      and datasheet revision are unchanged.
    - Exact-ref adjacency is a copper-edge gap on the named signal or non-poured rail, not a routed length. Ground-return
      qualification remains separate.
    - All eight amplifiers and their own 100nF capacitors share N3V3_ADC. Each bypass remains bound to its exact U_AFE
      instance.
    - R_X and C_FB stay beside FB/OUT; R_OUT is the 10ohm output resistor. Two 15nF C0G shunts per leg replace C_DIFF;
      their returns must not inject into the input/feedback ground reference.
    - Passive external-bias divider/capacitor ownership now lives in RT0603BRD071KL; no ninth reference amplifier remains.
