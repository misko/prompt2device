  input_protection: "section6.1 footnote2: input signals beyond rail +/-0.5V must be limited to10mA or less; no separate output backdrive rating inferred"
  operating_temperature: "-40C to +125C specified range"
  quiescent_current: "1.7mA/channel maximum over-40..125C atVS5.5V, IO=0; not transient/output load"
