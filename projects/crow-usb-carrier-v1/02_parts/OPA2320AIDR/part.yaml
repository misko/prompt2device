  msl: "Level 2, 260C, 1 year for OPA2320AIDR"
gotchas:
  - "Exact OPA2320AIDR is the dual D/SOIC-8 WITHOUT shutdown; OPA2320S has a different10-pin package. Do not infer a shutdown pin from the family title."
  - "Input, output, and feedback current loops must remain local; do not route a channel's output parallel to its high-impedance input."
  - "ADR0025 shares3V3_ADC across ADC and eight amplifiers; passive1k/1k reference dividers replace U_AFE9. No independent5V_OPA reservoir remains."
  - "The independent ground shunts change common-mode loading. Local return, output tracking, noise and filter-loop stability remain first-article obligations."
  - "Typical noise/distortion data is not an exact Cirrus AN0556 performance guarantee; retained1.2Vrms differential operation still requires measurement."
verified: "CITED: SBOS513F p4 OPA2320 D-package top view and pin-functions table:1=OUTA,2=-INA,3=+INA,4=V-,5=+INB,6=-INB,7=OUTB,8=V+. Main visual read and fresh independent source review2026-09-09; generated/native acceptance remains incomplete."
