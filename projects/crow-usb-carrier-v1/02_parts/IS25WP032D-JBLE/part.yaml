gotchas:
- Power reset returns standard SPI mode; all four data pins are used only after a
  supported Quad-I/O command sequence.
- CE# must remain high for at least tVCE=300 us after VCC reaches 1.65 V; the 4.7
  kohm CE# pull-up and delayed XU reset enforce deselection during that interval.
- Hardware is source-compatible with xflash device inquiry/SFDP, but exact XTC/XN
  programming support remains a recorded software-programming gate; no image is authored
  here.
