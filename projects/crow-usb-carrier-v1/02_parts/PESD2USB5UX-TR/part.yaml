gotchas:
- Pins 1/2 are separate protected cathodes on USB_DP/USB_DN; pin 3 is common-anode GND.
- JLC exact C3709087 public page lists SMT Assembly and Economic and Standard PCBA. Public stock is dated and not reserved.
- Manufacturer datasheet names PESD2USB5UX-T; JLC's -TR suffix is the reel listing and shares the exact SOT23 pin map.
- 5.0-V reverse standoff covers Crow's conservative 3.60-V XU316 USB supply ceiling for steady-state leakage, but USB pin transient stress is unproven.
- Higher 7.2-11-V breakdown and lower 8-kV IEC/4-A surge ratings than 3UV make powered/unpowered XU316 coordination and system ESD explicit open gates; typical TLP clamp is not a pin-stress guarantee.
- 0.60-pF maximum shunt capacitance still needs realized USB high-speed insertion-loss and eye review.
- Connector FULL, P1/P3 placement/return, and exact assembly mask/stencil remain pending.
verified: Primary datasheet Tables 2-6 and Figures 13-14 inspected 2026-09-25; exact public catalog page identifies C3709087 as SMT Economic/Standard. This is a provisional source candidate only.
