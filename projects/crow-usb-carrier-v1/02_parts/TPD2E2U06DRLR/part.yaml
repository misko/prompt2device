gotchas:
- Pins 1 and 2 are NC in DRL. They may float or be tied to ground/VCC per TI, but are not protected channels.
- Route connector to IO pin first and onward to the protected circuit; a long branch to the clamp defeats the low-inductance
  ESD path.
- Component IEC ratings do not by themselves qualify a complete cable, connector, enclosure, or system.
