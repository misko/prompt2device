gotchas:
- Bottom I/O/JTAG/crystal/reset domain is always 1.8 V. L/R/T selectors are tied low
  and all four GPIO banks run at 1.8 V.
- EP129 is VSS. Inline footprint has no thermal vias; board floorplan must add fabrication
  vias later.
layout:
  source: XMOS XM-014532-PC v2.0.0 Sections 7.3 and 14, plus Appendix I PCB Layout
    Design Checklist
  reviewed: 2026-09-22
  notes:
  - 'Evidence grade: primary manufacturer integration and layout checklist. Distribute
    the fifteen C_XU_VDD_* 100 nF capacitors around VDD pins and the eight C_XU_VDDIO_*
    capacitors around their named VDDIO pins; each ground side needs a direct, short
    return toward the device center/ground pins.'
  - Keep FB_PLL, C_PLL_1U, and C_PLL_100N local to PLL_AVDD pin 41/PLL_AGND pin 42
    and isolate PLL_0V9 from noisy supplies. Place Y_XU, R_XTAL_DRIVE, R_XTAL_FB,
    C_XTAL_IN, and C_XTAL_OUT tightly around XIN pin 34/XOUT pin 33.
  - "Route USB_DP/USB_DM as a 90 ohm differential pair with continuous reference,\
    \ matched lengths, minimal vias, no stubs, and the spacing rules in Sections 14.1\u2013\
    14.2. Connect EP129 and every ground pin directly to board ground with the thermal/ground-via\
    \ treatment in Sections 14.4 and Appendix I."
