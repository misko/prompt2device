gotchas:
- VDD=0 isolates both channels. With VDD valid SEL=0 selects floating unused A throws;
  SEL=1 selects B audio throws. AUDIO_EN remains the common active-high control; downstream
  10k pulldowns define ADC nodes when muted.
- Recommended analog I/O -12..+12V and 5V held rail; retain first-article partial-VDD
  and fault transient tests. SEL fail-safe to 5.5V for VDD=0 but not negative SEL
  faults.
- Published 0.001% THD+N uses 0.5Vpp, 0V bias test stimulus; do not claim guaranteed
  distortion at the 1.65V-biased Crow path.
- B2 Ø0.35/0.20 filled+capped Type VII via shares the complete 0.20 drill family with
  six U_LDO Ø0.50/0.20 thermal vias; eight B2 sites are proposed. Exact board census
  and JLC uploader/CAM/PCBA acceptance remain owed.
- TI example lands Ø0.23; JLC advanced four-layer minimum Ø0.25 used. Center solder-mask-defined
  Ø0.25 aperture over Ø0.35 capped copper. No vendor yield guarantee at exact 0.10mm
  via-to-pad gap.
