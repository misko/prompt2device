gotchas:
- 'This is a data-capable USB device port: join A6/B6 to D+ and A7/B7 to D-. Do not
  inherit power-only no-connect annotations.'
- CC1 and CC2 are separate; each needs its own device-side termination. Do not short
  CC pins.
- SBU1/SBU2 are unused in USB2-only mode and need explicit schematic no-connect disposition.
- VBUS is a separate host-presence/sense domain; it must not be tied to carrier power
  under the self-powered architecture.
- Shell is a separately named shield contact. Its board-level CHASSIS/GND bond and
  ESD return strategy require review.
- Four VBUS/GND contact pairs share manufacturer-defined solder lands. Preserve logical
  contact aliases and all four shell stakes.
- The footprint uses the standard KiCad10 3D model variable. Successful model resolution
  is not mating/registration evidence.
