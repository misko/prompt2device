gotchas:
  - 'The 0.8uVrms noise figure is a typical datasheet value at 500mA with 4.7uF CSET, not a guaranteed board-level audio-noise result. Capacitor leakage, piezoelectric response, layout and actual load remain qualification items.'
  - 'The PGFB divider enables fast startup with the larger CSET. The datasheet 10ms typical example is informative, not a candidate timing guarantee. Supervisor, hold-up, dump and ADC reset timing require joint transient review.'
  - 'Programmed 450mA minimum current limit exceeds the 250mA allocation by 200mA. Short-circuit, dump, capacitor charging and fault energy remain qualification items.'
  - 'EP11 and GND8 must be soldered/common. OUTS9 must Kelvin-sense the output-capacitor/load node; SET return joins the output-capacitor ground directly.'
