gotchas:
- Pins 1/2 are separate protected cathodes on USB_DP/USB_DN; pin 3 is common-anode GND.
- JLC exact C3704436 page lists SMT Assembly and Economic and Standard PCBA. Public stock is dated and not reserved.
- The manufacturer datasheet names PESD2USB3UV-T; JLC's -TR suffix is the reel ordering alias, independently checked against the public catalog.
- TLP clamp is a test-condition typical value, not proof of XU316 pin survival, especially unpowered.
- One-pF maximum shunt capacitance needs USB high-speed insertion-loss and eye review on the realized pair.
- Connector FULL, P1/P3 placement/return, system ESD, and exact assembly mask/stencil remain pending.
