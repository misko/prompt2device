# Crow USB routing intent. Width floors do not prove routed IR or thermal margins.
# Stack/model authority: rf.yaml and the retained vendor-response research.
fab_tier: jlc_4layer_advanced
default_clearance: 0.15mm
default_track_width: 0.20mm
classes:
  USB_HS:
    nets: [USB_DP, USB_DN]
    current: signal
    min_width: 0.410mm
    clearance: 0.150mm
    via_diameter: 0.6mm
    via_drill: 0.3mm
    diff_pair: {width: 0.410mm, gap: 0.150mm}
    intent: Nominal 90 ohm masked F.Cu pair over continuous In1.Cu; exact geometry in rf.yaml.
    routing: Coupled pair; source and connector escapes require exact-board review.
    verify: Native differential-pair recognition, geometry, continuous return and at most 1 mm skew.
  INPUT_TRUNK:
    nets: [N12V_IN, N12V_FUSED, N12V_PROTECTED]
    min_width: 1.2mm
    clearance: 0.2mm
    current: 2.85A
    intent: Input trunk includes the 2.85 A continuous source-limited fault screen; allocate every neck/joint in the delivery budget.
    routing: Broad continuous copper; width is a preliminary floor, not an IR qualification.
    verify: Exact-board ampacity and source-to-spoke voltage drop at the hot operating corner.
  PARENT_5V:
    nets: [N5V_BUCK]
    min_width: 1.0mm
    clearance: 0.2mm
    current: 1.9A
    intent: Parent 5 V distribution under the current design allocation.
    routing: Broad copper with converter loops kept local.
    verify: Power-tree current census, dropout, IR and thermal analysis on realized copper.
  DIGITAL_POWER:
    nets: [N0V9, N1V8, N3V3X, U_CORE_SW, U_1V8_SW, U_3V3X_SW]
    min_width: 0.6mm
    clearance: 0.15mm
    current: 1.2A
    intent: Low-voltage digital rails; 1.2 A is the largest provisional rail allowance.
    routing: Short local converter loops and broad distribution; switching nodes remain small islands.
    verify: Per-rail load, voltage drop and exact converter loop geometry.
  POD_POWER:
    nets: [N12V_POD1, N12V_POD2, N12V_POD3, N12V_POD4, N12V_POD5, N12V_POD6, N12V_POD7, N12V_POD8]
    min_width: 0.5mm
    clearance: 0.2mm
    current: 0.1A
    intent: Eight independently protected concurrent spoke feeds.
    routing: Copper sized against the board-connector delivery requirement.
    verify: Each connector contact bank meets requirements.yaml after hot fuse/copper/joint drop.
  QUIET_POWER:
    nets: [N5V_LDO_FEED, N5V_LDO_HOLD, N3V3_ADC]
    min_width: 0.5mm
    clearance: 0.2mm
    current: 0.25A
    intent: Retained analog held rail and ADC supply distribution.
    routing: Keep charging, discharge and regulator loops away from analog input returns.
    verify: Quiet-rail load/hold-up/dropout and current-return review.

# Realized-copper authority for the reversible USB-C pair.  Each signal net is
# a tree: two receptacle contacts and the shunt ESD signal pad are leaves, and
# the XU316 USB pin is the device-side leaf.  The three identically named paths
# make the independent audit compare like-for-like P/N copper without claiming
# that duplicated contacts or the shunt clamp are series boundaries.
length_match:
  USB_DEVICE:
    adr: "0008"
    intent: >-
      Bound realized USB_DP/USB_DN skew from each reversible Type-C data
      contact and from the connector-side shunt ESD branch to the corresponding
      XU316 PHY pin, while independently enforcing the source no-via decision.
    members:
      P: [USB_DP]
      N: [USB_DN]
    topology: tree
    no_vias: true
    max_spread_mm: 1.0
    router_moves: octilinear
    # Pre-route octilinear lower-bound anchor.  The complete reversible and
    # ESD-leaf inventory is declared separately in paths below.
    octilinear_endpoints:
      P: [J_USB.4, U_XU.60]
      N: [J_USB.5, U_XU.59]
    paths:
      P:
        - id: type_c_a_to_phy
          segments:
            - {net: USB_DP, from: J_USB.4, to: U_XU.60}
        - id: type_c_b_to_phy
          segments:
            - {net: USB_DP, from: J_USB.12, to: U_XU.60}
        - id: esd_shunt_to_phy
          segments:
            - {net: USB_DP, from: U_USB_ESD.1, to: U_XU.60}
      N:
        - id: type_c_a_to_phy
          segments:
            - {net: USB_DN, from: J_USB.5, to: U_XU.59}
        - id: type_c_b_to_phy
          segments:
            - {net: USB_DN, from: J_USB.13, to: U_XU.59}
        - id: esd_shunt_to_phy
          segments:
            - {net: USB_DN, from: U_USB_ESD.2, to: U_XU.59}
