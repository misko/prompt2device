  rationale: User explicitly requested an onboard USB IC. Count all101 digital support references
    and all6 USB-front-end references, including regulators, flash, clocks, reset, programming and
    ADC interface conditioning.
  exception:
    decision_rationale: An external bridge cannot satisfy the requested onboard-IC boundary. XU316
      supports the selected high-speed multichannel USB architecture with an exposed hardware programming
      interface; board-specific firmware remains a separate unimplemented dependency.
    evidence: 01_docs/research/2026-09-22-usb-ic-research.md and digital-source-adoption.md document
      exact part selection, source support and stack capabilities. BRIEF D2 supersedes the research
      report prior firmware-authorization interpretation.
    modules_considered:
    - part: miniDSP MCHStreamer
      rejected_because: The previous external USB bridge does not satisfy the newly requested onboard
        bare-IC carrier architecture.
      evidence: User request in BRIEF original prompt and ADR0001; retained carrier used this external
        transport.
    - part: XMOS XK-AUDIO-316-MC
      rejected_because: Useful reference and prototype platform, but adopting the evaluation board
        does not implement the requested onboard IC and Crow analog/power interface on the new carrier.
      evidence: XMOS multichannel reference hardware and USB stack evidence linked in 2026-09-22-usb-ic-research.md.
    adr: 01_docs/decisions/0003-integrated-subsystem-boundaries.md
- function: external_twelve_volt_to_five_volt
  part: TPSM63603V5RDHR
  implementation: module
  rationale: Selected integrated inductor/switching power module reduces external switching-loop
    assembly complexity. Its surrounding input protection, capacitors and AGND join remain explicitly
    designed in the17-reference source module. Four-layer thermal and manufacturing assumptions still
    require verification.
  support_refs:
  - C_IN3
