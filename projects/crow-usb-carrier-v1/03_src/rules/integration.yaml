  rationale: Retain the existing eight-channel converter and the complete297-component analog/spoke/quiet-power
    source boundary. The296 supporting references deliberately include shared infrastructure, rather
    than undercounting a minimal ADC example.
  exception:
    decision_rationale: The retained Crow balanced analog and powered spoke interface must feed one
      synchronous converter; a USB transport module does not replace that analog front end.
    evidence: Retained Crow architecture and current297-reference analog source; donor integration
      comparison names the Cirrus evaluation assembly and MCHStreamer. Their prior board approvals
      are not inherited.
    modules_considered:
    - part: miniDSP MCHStreamer
      rejected_because: Digital USB/TDM transport does not supply the eight balanced analog converter
        channels and protected powered RJ45 interfaces.
      evidence: Retained source research and miniDSP MCHStreamer User Manual TDM8 interface, referenced
        in the prior carrier integration contract.
    - part: Cirrus DC5308P evaluation platform
      rejected_because: Evaluation hardware is a reference for ADC circuitry, not the requested carrier
        with eight protected Crow spoke interfaces.
      evidence: Cirrus evaluation schematic/layout archive cited by the retained analog source adoption
        and prior carrier integration contract.
    adr: 01_docs/decisions/0003-integrated-subsystem-boundaries.md
