# Applicability is adopted; the cross-section remains unadmitted until the
# exact fabrication stackup and differential solver result are available.
schema: 1
rf:
  enabled: true
  rationale: >-
    The carrier uses the XU316 high-speed USB PHY. Its USB_DP/USB_DM route
    requires controlled differential impedance and an uninterrupted return.
  risk_tier: controlled-impedance
  risk_basis: >-
    XMOS XM-014532-PC v2.0.0 sections 14.1-14.2 specify 90 ohm USB
    differential impedance, matched pair routing and continuous references.
    The published example dimensions are not a fabrication stackup selection.
  ports:
    - id: USB_DEVICE
      nets: [USB_DP, USB_DM]
      band_hz: [0, 2400000000]
      z0_ohm: 90
      launch: GCT USB4105 through TPD2EUSB30A to XU316 pins 60/59
      termination: XU316 integrated USB PHY; no external parallel resistor added
      reference_layer: In1.Cu
  # Deliberately incomplete: no invented dielectric thickness, Dk or trace
  # geometry. RF-CONTRACT must refuse source admission until this is populated.
  cross_sections: []
