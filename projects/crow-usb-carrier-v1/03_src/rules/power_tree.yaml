  # Two TLV6140s + retained OPA/filter loads on N3V3_ADC. These are typical
  # planning currents, not a manufacturer maximum or a changed rail limit.
  # 42.8mA two ADCs + 23.2mA sixteen OPA channels + 3.3mA VMID dividers
  # + 16.5mA bleed = 85.8mA before supervisors/buffers/transients.
  # Headroom against the existing 250mA allocation is 164.2mA typical-plan.
  # Fast SHDNZ_CFG=00 before capture reduces TLV powerdown t3/t4 to 100us;
  # the default preconfiguration state still requires >=10ms. Source candidate:
  # PWR_EN falling directly asserts SHDNZ through U_ADC_PWR_BAD/Q_ADC_PWR_RST;
  # 16x470uF C178530 are on 5V_LDO_HOLD; 8x15nF C0G C97907 and 150k
  # equivalent delay Q_DUMP/LDO_EN. Slow buck sag can reach the inherited
  # U_PWR lower trip4.649V before PWR_EN falls; minus the full0.81V path
  # allocation gives the adverse held start3.839V. Fast collapse from buck
  # minimum4.91V gives4.10V. Engineering retention0.54 gives4.061mF.
  # ADI LT3045 max350mV dropout at300mA and TI TLV min3.0V give held
  # terminal input3.35V. At <=120mA awake-before-fast-mode held load,
  # C*dV/I from3.839V to3.35V gives >=16.55ms versus TI default10ms;
  # at <=70mA clock-stopped pre-wake it gives >=28.37ms. C0G/Nexperia
  # dynamic screen gives dump15.45..32.87ms from adverse start at120mA.
  # Latest held VCC2.868V and Nexperia VOH>=VCC-0.1V at<100uA give
  # gate>=2.768V, above AO3400A characterized2.5V drive condition.
  # Three parallel1uF C_PWR_CT delay PWR_EN/Q_PRE bypass: with0.5 retained
  # each, TPS389001 VCTmin1.17V/ICTmax1.35uA give >=1.30s, versus
  # R_PRE22ohm*7.52mF nominal tau165ms. At +20% Panasonic bulk and
