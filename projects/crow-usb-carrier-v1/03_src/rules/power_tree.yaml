# WIP power contract; intentional unresolved numeric fields block admission.
schema: 1
source_type: isolated_external_12V_supply
source_voltage_boundary:
  minimum_operating_V: 11.4
  evidence: CROW_USB_POWER_BOUNDARY declares 11.4-13.2 V; isolation is external.
off_control: disconnect_J_PWR_external_isolated_12V_input
quiescent_ua: 0
input_trunk_class: INPUT_TRUNK
ir_floor_mohm: 150

upstream_delivery:
  source_net: N12V_IN
  destination_net: N12V_PROTECTED
  source_min_V: 11.4
  destination_floor_V: 11.006
  load_current_A: 2.185
  margin: 0.20
  evidence: >-
    Project engineering bound at the rounded 2.185 A one-fault screen. F_IN is
    allocated 48 milliohm, three times its exact 16 milliohm nominal-cold value;
    Q_IN is allocated 50 milliohm, twice its 25 milliohm 25 C maximum at
    VGS=-10 V; input connector/copper/vias/joints receive 52 milliohm. The
    150 milliohm total drops 327.75 mV; the owning gate's 20% adverse drop
    margin makes that 393.3 mV, so the rounded-down floor is 11.006 V.
    These adverse multipliers are project design reserves, not manufacturer
    guarantees; native extraction and hot four-wire first article must verify them.
  rails: [N5V_BUCK, N12V_POD1, N12V_POD2, N12V_POD3, N12V_POD4, N12V_POD5, N12V_POD6, N12V_POD7, N12V_POD8]
  fixed_drop_components_mV:
    no_series_diode: {value: 0, basis: topology, evidence: Q_IN is a reverse-hookup PFET.}
  resistance_components_mohm:
    F_IN_0451004_MRL: {value: 48, basis: project_bound_3x_nominal_cold, evidence: 'Littelfuse exact row gives 16 milliohm nominal cold; 3x reserve covers hot/aging spread for design, with hot four-wire verification owed.'}
    Q_IN_DMP6023LFG_13: {value: 50, basis: project_bound_2x_25C_max, evidence: 'Diodes DS37204 gives 25 milliohm maximum at VGS=-10 V; 2x reserve covers hot operation for design, with realized gate drive and hot four-wire verification owed.'}
    J_PWR_copper_vias_joints: {value: 52, basis: budgeted_max, evidence: 'Residual project allocation completing the 150 milliohm input-trunk ceiling; verify by route extraction and hot four-wire measurement.'}

# E-CAP engineering candidate. Numeric terms are conservative design bounds,
# not supplier guarantees. Exact characteristic plots establish typical
# centers; the declared adverse reserves are more severe, and first article
# must still verify startup, ripple and load-step stability. No service life is
# specified, so lifecycle percentages are engineering reserves rather than
# lifetime guarantees.
effective_capacitance_banks:
  - name: TPSM63603 N12V_PROTECTED input
    requirement_uF: 9.4
    requirement_evidence: >-
      Project conservative effective floor derived from TI SLVSFS5A's
      two-4.7-uF nominal ceramic input recommendation; TI does not label
      9.4 uF as an effective-capacitance minimum.
    accepted_dielectrics: [x7r]
    contributors:
      - part: 12105C106K4Z2A
        refs: [C_IN1, C_IN2, C_IN3]
        nominal_each_uF: 10
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 40
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_engineering_bound
        evidence: >-
          Exact Kyocera AVX K-tolerance PDF gives 10 uF +/-10%, 50 V and X7R.
          Its typical 13.2 V DC/AC screen retains about 80%; this candidate
          instead retains only 60% for combined voltage effects, the full 15%
          X7R temperature allowance, and a separate chosen 10% lifecycle
          reserve. Three parts give 12.393 uF. The plot remains typical and the
          reserve is an engineering bound, not a guaranteed production limit.
  - name: TPSM63603 N5V_BUCK output
    requirement_uF: 25
    requirement_evidence: TI SLVSFS5A section 8.2.1.2.5 requires 25 uF effective output capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_OUT1, C_OUT2, C_OUT3]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 69
        temperature_derating_pct: 0
        lifecycle_derating_pct: 12.5
        basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review
        evidence: >-
          Murata SimSurfing exact-base-part simple model at -55 C and 5.099 V
          gives 14.7 uF per part, or 31.3% nominal. Use 31% retained as a
          rounded model screen at the worst proposed TPSM output ceiling;
          5.05 V gives the same rounded model value. Temperature is already
          included, so the separate temperature factor is zero. Three parts
          estimate 34.42 uF after 10% initial-tolerance and selected 12.5%
          lifecycle reserves. Model and reserves are not production guarantees;
          independent evidence and startup/load-step stability are owed.
  - &tps62825_input
    name: TPS62825 U_3V3X input
    requirement_uF: 3
    requirement_evidence: TI SLVSEF9I minimum effective input capacitance.
    accepted_dielectrics: [x5r]
    contributors:
      - part: CL21A106KOCLRNC
        refs: [C_U_3V3X_IN_1, C_U_3V3X_IN_2]
        nominal_each_uF: 10
        dielectric: x5r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 75
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          Samsung retained typical curves: DC retention35.959775% at5.11605V
          (above5.05V maximum), low-amplitude AC retention75.4752%.
          Their product screens to27.14%; use more adverse25% combined
          retention,10% initial tolerance,15% temperature and10% lifecycle
          allowances. Two parts give3.4425uF versus3uF. Separate typical
          curves and selected reserves are not guaranteed joint PVT/aging
          bounds; first-article ripple/startup/transient qualification remains.
  - <<: *tps62825_input
    name: TPS62825 U_1V8 input
    contributors:
      - {part: CL21A106KOCLRNC, refs: [C_U_1V8_IN_1, C_U_1V8_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 75, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same exact 5.05 V maximum input-bank condition and conservative 25% combined DC/AC retention as U_3V3X; 3.4425 uF effective by design estimate."}
  - <<: *tps62825_input
    name: TPS62825 U_CORE input
    contributors:
      - {part: CL21A106KOCLRNC, refs: [C_U_CORE_IN_1, C_U_CORE_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 75, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same exact 5.05 V maximum input-bank condition and conservative 25% combined DC/AC retention as U_3V3X; 3.4425 uF effective by design estimate."}
  - &tps62825_output
    name: TPS62825 U_3V3X output
    requirement_uF: 10
    requirement_evidence: TI SLVSEF9I section 8.2.2.5 requires 10 uF minimum effective output; Table 8-3 marks 0.47 uH plus 47 uF nominal for TPS62825.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_U_3V3X_OUT_1]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 65
        temperature_derating_pct: 0
        lifecycle_derating_pct: 12.5
        basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review
        evidence: >-
          Exact Murata simple model at -55 C and 3.38 V gives 16.9 uF;
          35% nominal retention is a rounded model screen. After 10% initial
          tolerance and chosen 12.5% lifecycle reserve, estimate 12.95 uF.
          Temperature is included in the model. One 47-uF part restores TI's
          marked nominal 0.47-uH/47-uF LC combination; replacement inductor,
          distributed capacitance, startup and load-step stability remain owed.
  - <<: *tps62825_output
    name: TPS62825 U_1V8 output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_1V8_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review, evidence: "Exact Murata -55 C / 1.818 V simple model gives 18.4 uF; conservative rounded 35% nominal retention with initial-tolerance and lifecycle reserves estimates 12.95 uF. Temperature is already in the model. Nominal 0.47-uH/47-uF combination is marked in TI Table 8-3; physical stability proof remains owed."}
  - <<: *tps62825_output
    name: TPS62825 U_CORE output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_CORE_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review, evidence: "Exact Murata -55 C / 0.92 V simple model gives 18.7 uF; conservative rounded 35% nominal retention with initial-tolerance and lifecycle reserves estimates 12.95 uF. Temperature is already in the model. Nominal 0.47-uH/47-uF combination is marked in TI Table 8-3; physical stability proof remains owed."}
  - name: LT3045 input
    requirement_uF: 4.7
    requirement_evidence: ADI LT3045 Rev.D p18 requires at least 4.7 uF at IN.
    accepted_dielectrics: [x7r]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_IN], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 69, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review, evidence: "Exact Murata -55 C / 5.099 V simple model gives 14.7 uF; rounded 31% nominal retention with initial tolerance and selected lifecycle reserve estimates 11.47 uF. Temperature is in the model; input-loop damping and source-independent evidence remain owed."}
  - name: LT3045 output
    requirement_uF: 10
    requirement_evidence: ADI LT3045 Rev.D pp13,16 requires at least 10 uF with ESR below 20 milliohm and assembled ESL below 2 nH.
    accepted_dielectrics: [x7r]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_OUT_1, C_LDO_OUT_2], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_engineering_reserves_pending_independent_review, evidence: "Exact Murata -55 C / 3.38 V model gives 16.9 uF each; rounded 35% retention with tolerance/lifecycle reserves estimates 25.91 uF for pair. 125 C model gives 0.657 nH and 2.13 milliohm per part; ideal parallel is 0.3285 nH and 1.065 milliohm. P3 quiet_power must independently prove all shared interconnect below the remaining 1.6715 nH for assembled ESL strictly below 2 nH, with Kelvin OUTS and common SET/output ground; neither model values nor board ESL are production guarantees. First-article startup/load-step stability and lot-characteristic review remain owed."}
  - name: XU316 USB VBUS sense capacitance
    requirement_uF: 1
    requirement_evidence: XMOS self-powered reference requires 1-10 uF at connector VBUS.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GCM21BR71C475KA73L
        refs: [C_USB_VBUS]
        nominal_each_uF: 4.7
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 64
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          Exact Murata typical curves are bracketed at the worse 6 V point for
          the 5.25 V USB ceiling (60% DC retention) and the lowest plotted AC
          drive (60% AC retention). Their product is 36% combined retention,
          represented here as 64% combined voltage derating. With tolerance,
          full X7R temperature allowance and a separate 10% lifecycle reserve,
          the estimate is 1.164942 uF. The curves are typical, the reserves are
          engineering bounds, and first-article measurement remains required.
  - &cs5308_ldo_filter
    name: CS5308P LDO_A filter capacitor
    requirement_uF: 1
    requirement_evidence: Cirrus DS1314F1 Figure 2-1 shows a 1 uF capacitor at LDO_A_FILT.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GCM21BR71C475KA73L
        refs: [C_LDO_A]
        nominal_each_uF: 4.7
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 52
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          At the conservative 3.6 V ADC supply ceiling, use the worse Murata 4 V
          point (80% DC retention) and lowest-drive AC point (60% retention),
          or 48% combined retention. After tolerance, temperature and 10%
          lifecycle reserves, the part estimates 1.553256 uF, 55.3% above the
          Cirrus shown 1 uF.
  - <<: *cs5308_ldo_filter
    name: CS5308P LDO_D filter capacitor
    requirement_evidence: Cirrus DS1314F1 Figure 2-1 shows a 1 uF capacitor at LDO_D_FILT.
    contributors:
      - {part: GCM21BR71C475KA73L, refs: [C_LDO_D], nominal_each_uF: 4.7, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 52, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same conservative 3.6 V screen as LDO_A: 48% combined DC/AC retention plus tolerance, temperature and lifecycle reserves estimates 1.553256 uF, 55.3% above the Cirrus shown 1 uF."}
  - &cs5308_vmid_bypass
    name: CS5308P ADC_VMID1 bulk bypass capacitor
    requirement_uF: 2.2
    requirement_evidence: Cirrus DS1314F1 Figure 2-1 shows a 2.2 uF bulk bypass at ADC_VMID1, in parallel with a separate 0.22 uF high-frequency capacitor.
    accepted_dielectrics: [x7r]
    contributors:
      - part: C0805C106K8RACTU
        refs: [C_VMID1_4U7]
        nominal_each_uF: 10
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 50
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_engineering_bound
        evidence: >-
          Existing exact-part engineering screen charges 50% DC-bias, 15%
          temperature and 10% lifecycle loss in addition to tolerance. Each
          10 uF capacitor estimates 3.4425 uF, 56.5% above the Cirrus shown
          2.2 uF. Reference settling,
          ripple and THD remain first-article qualifications.
  - <<: *cs5308_vmid_bypass
    name: CS5308P ADC_VMID2 bulk bypass capacitor
    requirement_evidence: Cirrus DS1314F1 Figure 2-1 shows a 2.2 uF bulk bypass at ADC_VMID2, in parallel with a separate 0.22 uF high-frequency capacitor.
    contributors:
      - {part: C0805C106K8RACTU, refs: [C_VMID2_4U7], nominal_each_uF: 10, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_engineering_bound, evidence: "Same exact-part screen as ADC_VMID1 estimates 3.4425 uF, 56.5% above the Cirrus shown 2.2 uF; reference settling, ripple and THD remain first-article qualifications."}

rails:
  - {name: N5V_BUCK, vin_min: 11.006, vin_max: 13.2, vout_min: 4.95, vout_max: 5.05, iout_max_A: 1.9, converter: TPSM63603V5RDHR, eff: 0.85, external_output: false}
  - {name: N3V3X, vin_min: 4.95, vin_max: 5.05, vout_min: 3.267, vout_max: 3.333, iout_max_A: 1.0, converter: TPS6282533DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N1V8, vin_min: 4.95, vin_max: 5.05, vout_min: 1.782, vout_max: 1.818, iout_max_A: 0.30, converter: TPS6282518DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N0V9, vin_min: 4.95, vin_max: 5.05, vout_min: 0.88, vout_max: 0.92, iout_max_A: 1.2, converter: TPS62825DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N3V3_ADC, vin_min: 4.10, vin_max: 5.05, vout_min: 3.22, vout_max: 3.38, iout_max_A: 0.25, converter: LT3045EDD#PBF, input_parent: N5V_BUCK, dropout_mv: 450, pdiss_max_mw: 650, eff: 0.65, external_output: false}
  - &spoke
    name: N12V_POD1
    stage: distribution
    vin_min: 11.006
    vin_max: 13.2
    vout_min: 11.006
    vout_max: 13.2
    iout_max_A: 0.10
    ir_budget_mohm: 1710
    ir_budget_components_mohm:
      protection_switch: {value: 800, basis: maximum, evidence: 'TPS26625 manufacturer RON maximum over -40 to 125 C.'}
      pcb_copper_vias_joints: {value: 810, basis: budgeted_max, evidence: 'Pre-layout allocation; verify by post-route extraction and first-article four-wire measurement.'}
      connector_contacts: {value: 100, basis: budgeted_max, evidence: 'Board-side paralleled contact allocation; mated cable loss belongs to the external source envelope.'}
    external_output: true
    claim_id: eight_analog_spokes
    load_uv_threshold: 10.8
    margin: 0.20
    margin_basis: requirement_boundary_only
    margin_evidence: >-
      The 10.8 V connector-plane floor is the requirement. TPS26625 RON is
      bounded at 800 milliohm over -40 to 125 C, so its own normal 0.10 A drop
      is at most 80 mV. Missing copper, joint, contact and thermal realization
      deliberately leave the complete connector-plane delivery unqualified.
    distribution:
      kind: active_current_limiter
      series_devices: [TPS26625DRCR]
      path_resistance_max_mohm: 800
      current_limit_min_A: 0.145
      current_limit_max_A: 0.159
      engineering_screen_current_limit_A: [0.145, 0.159]
      engineering_screen_condition: TI electrical table at VIN=24V and VIN-VOUT=1V with 44.2kohm ILIM
      engineering_screen_resistor: RT0603BRD0744K2L, 0.1 percent, 25 ppm/C
      engineering_screen_operating_ambient_max_C: 70
      device_quiescent_current_max_uA_at_24V_table_condition: 482
      eight_device_quiescent_current_screen_mA: 3.856
      inherited_normal_load_allocation_A: 2.12
      normal_source_current_screen_including_table_conditioned_efuse_iq_A: 2.123856
      normal_drop_grade: manufacturer_maximum_RON
      normal_drop_locator: TI SLVSDT4F electrical table, RON maximum 800 milliohm over -40 to 125 C
      reverse_current_policy: TPS26625 output-side reverse protection is present; externally powered pods remain outside the admitted operating states pending verification.
      fault_containment_status: OPEN_SOURCE_LOAD_LINE_HICCUP_CABLE_RL_THERMAL_RETRY_NOT_QUALIFIED
      transient_status: OPEN_220NS_AND_1P6A_ARE_TYPICAL_OR_UNBOUNDED_NOT_GUARANTEED_MAXIMA
      startup_status: OPEN_ALL_POD_LOAD_AND_CAPACITANCE_STATES
      upstream_input_protection: {part: 0451004.MRL, hot_continuous_screen_A: 2.85, one_fault_screen_A: 2.185, screen_margin_A: 0.665, coordination: 'Fuse remains intact for one branch-limited fault. A common-trunk or shorted-TVS fault may either clear the fuse or remain inside the bounded source-limit/hiccup mode in protection_paths.yaml.'}
  - {<<: *spoke, name: N12V_POD2}
  - {<<: *spoke, name: N12V_POD3}
  - {<<: *spoke, name: N12V_POD4}
  - {<<: *spoke, name: N12V_POD5}
  - {<<: *spoke, name: N12V_POD6}
  - {<<: *spoke, name: N12V_POD7}
  - {<<: *spoke, name: N12V_POD8}
