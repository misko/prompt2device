    Q_IN_DMP6023LFG_13: {value: 50, basis: project_bound_2x_25C_max, evidence: 'Diodes DS37204 gives 25 milliohm maximum at VGS=-10 V; 2x reserve covers hot operation for design, with realized gate drive and hot four-wire verification owed.'}
