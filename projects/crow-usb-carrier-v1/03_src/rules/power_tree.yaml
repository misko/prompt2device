# WIP power contract; intentional unresolved numeric fields block admission.
schema: 1
source_type: isolated_external_12V_supply
source_voltage_boundary:
  minimum_operating_V: 11.4
  maximum_operating_V: 13.2
  evidence: CROW_USB_POWER_BOUNDARY declares 11.4-13.2 V; isolation is external.
off_control: disconnect_J_PWR_external_isolated_12V_input
quiescent_ua: 0
input_trunk_class: INPUT_TRUNK
ir_floor_mohm: 100

upstream_delivery:
  source_net: N12V_IN
  destination_net: N12V_PROTECTED
  source_min_V: 11.4
  destination_floor_V: 11.196
  load_current_A: 2.12
  margin: 0.20
  evidence: >-
    Partial source-stage bound only. F_IN uses the exact 2920L330/24
    55 milliohm R1max and Q_IN uses the DMP6023LFG-13 25 milliohm maximum
    at VGS=-10 V. Copper, joints and connector resistance remain unallocated;
    therefore this is not a qualified connector-plane floor.
  rails: [N5V_BUCK, N12V_POD1, N12V_POD2, N12V_POD3, N12V_POD4, N12V_POD5, N12V_POD6, N12V_POD7, N12V_POD8]
  fixed_drop_components_mV:
    no_series_diode: {value: 0, basis: topology, evidence: Q_IN is a reverse-hookup PFET.}
  resistance_components_mohm:
    F_IN_2920L330_24DR: {value: 55, basis: manufacturer_R1max, evidence: Littelfuse exact 2920L330/24 row.}
    Q_IN_DMP6023LFG_13: {value: 25, basis: manufacturer_maximum_at_VGS_minus10V, evidence: Diodes DS37204 Rev.2-2.}

# E-CAP engineering candidate. Numeric terms are conservative design bounds,
# not supplier guarantees. Exact characteristic plots establish typical
# centers; the declared adverse reserves are more severe, and first article
# must still verify startup, ripple and load-step stability. No service life is
# specified, so lifecycle percentages are engineering reserves rather than
# lifetime guarantees.
effective_capacitance_banks:
  - name: TPSM63603 N12V_PROTECTED input
    requirement_uF: 9.4
    requirement_evidence: >-
      Project conservative effective floor derived from TI SLVSFS5A's
      two-4.7-uF nominal ceramic input recommendation; TI does not label
      9.4 uF as an effective-capacitance minimum.
    accepted_dielectrics: [x7r]
    contributors:
      - part: 12105C106K4Z2A
        refs: [C_IN1, C_IN2, C_IN3]
        nominal_each_uF: 10
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 40
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_engineering_bound
        evidence: >-
          Exact Kyocera AVX K-tolerance PDF gives 10 uF +/-10%, 50 V and X7R.
          Its typical 13.2 V DC/AC screen retains about 80%; this candidate
          instead retains only 60% for combined voltage effects, the full 15%
          X7R temperature allowance, and a separate chosen 10% lifecycle
          reserve. Three parts give 12.393 uF. The plot remains typical and the
          reserve is an engineering bound, not a guaranteed production limit.
  - name: TPSM63603 N5V_BUCK output
    requirement_uF: 25
    requirement_evidence: TI SLVSFS5A section 8.2.1.2.5 requires 25 uF effective output capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_OUT1, C_OUT2, C_OUT3]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 60
        temperature_derating_pct: 15
        lifecycle_derating_pct: 12.5
        basis: conservative_engineering_bound_with_adjacent_tolerance_proxy
        evidence: >-
          Exact K-tolerance PDF gives 47 uF +/-10%, 10 V and X7R, and reports a
          +/-12.5% post-endurance change after 1000 h at maximum temperature
          and 150% rated voltage. It has no DC-bias curve. TI's application BOM
          uses adjacent GRM32ER71A476ME15L (M means +/-20% rather than this K
          part's +/-10%) and reports about 48 uF effective for two at 5 V,
          about 51% typical retention each. This candidate uses only 40%
          retention and three exact K parts, giving 37.753 uF. The 12.5% term
          is a chosen lifecycle reserve informed by that endurance test, not a
          service-life guarantee; hot/load-step first-article proof remains due.
  - &tps62825_input
    name: TPS62825 U_3V3X input
    requirement_uF: 3
    requirement_evidence: TI SLVSEF9I minimum effective input capacitance.
    accepted_dielectrics: [x5r]
    contributors:
      - part: GRM21BR61C106KE15L
        refs: [C_U_3V3X_IN_1, C_U_3V3X_IN_2]
        nominal_each_uF: 10
        dielectric: x5r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 70
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          Exact Murata typical curves show about 45% DC retention at 5 V and
          about 80% additional AC-amplitude retention, or about 36% combined.
          The single E-CAP voltage field uses the more adverse 30% combined
          retention, plus +/-10% initial tolerance, full 15% X5R temperature
          loss and a separate chosen 10% lifecycle reserve. Two parts give
          4.131 uF. These are design reserves, not curve guarantees.
  - <<: *tps62825_input
    name: TPS62825 U_1V8 input
    contributors:
      - {part: GRM21BR61C106KE15L, refs: [C_U_1V8_IN_1, C_U_1V8_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 70, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same exact 5 V input-bank condition and conservative 30% combined DC/AC retention as U_3V3X; 4.131 uF effective by design estimate."}
  - <<: *tps62825_input
    name: TPS62825 U_CORE input
    contributors:
      - {part: GRM21BR61C106KE15L, refs: [C_U_CORE_IN_1, C_U_CORE_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 70, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same exact 5 V input-bank condition and conservative 30% combined DC/AC retention as U_3V3X; 4.131 uF effective by design estimate."}
  - &tps62825_output
    name: TPS62825 U_3V3X output
    requirement_uF: 10
    requirement_evidence: TI SLVSEF9I section 8.2.2.5 requires 10 uF minimum effective output capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_U_3V3X_OUT_1]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 65
        temperature_derating_pct: 15
        lifecycle_derating_pct: 12.5
        basis: conservative_engineering_bound_with_nominal_TI_LC_match
        evidence: >-
          Nominal 47 uF with 0.47 uH matches a combination in TI SLVSEF9I
          Table 8-3; its footnote anticipates 35% effective-capacitance loss,
          so that table does not validate this candidate's more adverse full
          derating envelope. Section 8.2.2.5 independently requires 10 uF
          effective. Exact K-tolerance PDF gives 47 uF +/-10%, 10 V and X7R but
          no DC-bias curve. TI's adjacent M-tolerance sibling reports about 51%
          typical retention at the more adverse 5 V condition; this estimate
          retains only 35% for voltage at 3.3 V, then separately charges 15%
          temperature and a chosen 12.5% lifecycle reserve, for 11.011 uF.
          No exact-K curve, production guarantee, or stability proof is claimed;
          startup and load-step first-article proof remains due.
  - <<: *tps62825_output
    name: TPS62825 U_1V8 output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_1V8_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 15, lifecycle_derating_pct: 12.5, basis: conservative_engineering_bound_with_nominal_TI_LC_match, evidence: "Same conservative 35% retained-capacitance voltage estimate as the 3.3 V bank; lower bias can only improve the typical screen. After the separate temperature and lifecycle reserves, estimated effective capacitance is 11.011 uF against section 8.2.2.5's 10 uF minimum; startup/load-step proof remains due."}
  - <<: *tps62825_output
    name: TPS62825 U_CORE output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_CORE_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 15, lifecycle_derating_pct: 12.5, basis: conservative_engineering_bound_with_nominal_TI_LC_match, evidence: "Same conservative 35% retained-capacitance voltage estimate as the 3.3 V bank; lower bias can only improve the typical screen. After the separate temperature and lifecycle reserves, estimated effective capacitance is 11.011 uF against section 8.2.2.5's 10 uF minimum; startup/load-step proof remains due."}

rails:
  - {name: N5V_BUCK, vin_min: 11.196, vin_max: 13.2, vout_min: 4.95, vout_max: 5.05, iout_max_A: 1.9, converter: TPSM63603V5RDHR, eff: 0.85, external_output: false}
  - {name: N3V3X, vin_min: 4.95, vin_max: 5.05, vout_min: 3.267, vout_max: 3.333, iout_max_A: 1.0, converter: TPS6282533DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N1V8, vin_min: 4.95, vin_max: 5.05, vout_min: 1.782, vout_max: 1.818, iout_max_A: 0.30, converter: TPS6282518DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N0V9, vin_min: 4.95, vin_max: 5.05, vout_min: 0.88, vout_max: 0.92, iout_max_A: 1.2, converter: TPS62825DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N3V3_ADC, vin_min: 4.10, vin_max: 5.05, vout_min: 3.23, vout_max: 3.35, iout_max_A: 0.23, converter: LT3041ADE#TRPBF, input_parent: N5V_BUCK, dropout_mv: 500, pdiss_max_mw: 702, eff: 0.65, external_output: false}
  - &spoke
    name: N12V_POD1
    stage: distribution
    vin_min: 11.196
    vin_max: 13.2
    vout_min: 10.8
    vout_max: 13.2
    iout_max_A: 0.10
    external_output: true
    claim_id: eight_analog_spokes
    load_uv_threshold: 10.8
    margin: 0.20
    margin_basis: requirement_boundary_only
    margin_evidence: >-
      The 10.8 V connector-plane floor is the requirement. Only the retained
      branch PPTC maximum is quantified; missing copper/joint/contact resistance
      deliberately leaves zero proven delivery headroom.
    distribution:
      kind: passive_pptc
      series_devices: [1812L035/60MR]
      path_resistance_max_mohm: 1700
      hold_current_reference_A: 0.20
      hold_current_reference_temperature_C: 70
      operating_ambient_max_C: 70
      hold_current_reference_grade: manufacturer_reference
      hold_current_reference_locator: Littelfuse 1812L primary datasheet, ambient rerating table, 1812L035/60 row, 70 C column
      reverse_current_policy: External pods contain no admitted source; hot plug and downstream backfeed are prohibited.
  - {<<: *spoke, name: N12V_POD2}
  - {<<: *spoke, name: N12V_POD3}
  - {<<: *spoke, name: N12V_POD4}
  - {<<: *spoke, name: N12V_POD5}
  - {<<: *spoke, name: N12V_POD6}
  - {<<: *spoke, name: N12V_POD7}
  - {<<: *spoke, name: N12V_POD8}
