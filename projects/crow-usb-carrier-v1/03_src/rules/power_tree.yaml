# WIP power contract; intentional unresolved numeric fields block admission.
schema: 1
source_type: isolated_external_12V_supply
source_voltage_boundary:
  minimum_operating_V: 11.4
  maximum_operating_V: 13.2
  evidence: CROW_USB_POWER_BOUNDARY declares 11.4-13.2 V; isolation is external.
off_control: disconnect_J_PWR_external_isolated_12V_input
quiescent_ua: 0
input_trunk_class: INPUT_TRUNK
ir_floor_mohm: 100

upstream_delivery:
  source_net: N12V_IN
  destination_net: N12V_PROTECTED
  source_min_V: 11.4
  destination_floor_V: 11.196
  load_current_A: 2.12
  margin: 0.20
  evidence: >-
    Partial source-stage bound only. F_IN uses the exact 2920L330/24
    55 milliohm R1max and Q_IN uses the DMP6023LFG-13 25 milliohm maximum
    at VGS=-10 V. Copper, joints and connector resistance remain unallocated;
    therefore this is not a qualified connector-plane floor.
  rails: [N5V_BUCK, N12V_POD1, N12V_POD2, N12V_POD3, N12V_POD4, N12V_POD5, N12V_POD6, N12V_POD7, N12V_POD8]
  fixed_drop_components_mV:
    no_series_diode: {value: 0, basis: topology, evidence: Q_IN is a reverse-hookup PFET.}
  resistance_components_mohm:
    F_IN_2920L330_24DR: {value: 55, basis: manufacturer_R1max, evidence: Littelfuse exact 2920L330/24 row.}
    Q_IN_DMP6023LFG_13: {value: 25, basis: manufacturer_maximum_at_VGS_minus10V, evidence: Diodes DS37204 Rev.2-2.}

# E-CAP is deliberately fail-closed. The exact manufacturer PDFs establish
# tolerance and X5R/X7R temperature class, but publish DC/AC curves as typical
# only and provide no guaranteed aging lower bound. Text tokens in consumed
# numeric fields make the owning checker reject the contract rather than turn
# an unknown into 0% or a fabricated guarantee.
effective_capacitance_banks:
  - name: TPSM63603 N12V_PROTECTED input
    requirement_uF: 9.4
    requirement_evidence: TI SLVSFS5A requires 2x4.7 uF effective ceramic input capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: 12105C106K4Z2A
        refs: [C_IN1, C_IN2]
        nominal_each_uF: 10
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: UNBOUNDED_EXACT_PDF_CURVE_IS_TYPICAL_ONLY
        temperature_derating_pct: 15
        lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE
        basis: exact_primary_pdf_fail_closed
        evidence: >-
          Kyocera AVX exact PDF guarantees 9-11 uF at its measurement condition
          and X7R temperature class. Its DC, AC and temperature plots are
          characteristics, not guaranteed lower limits; no aging rate is given.
  - name: TPSM63603 N5V_BUCK output
    requirement_uF: 25
    requirement_evidence: TI SLVSFS5A section 8.2.1.2.5 requires 25 uF effective output capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_OUT1, C_OUT2, C_OUT3]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: UNBOUNDED_NO_EXACT_GUARANTEED_DC_BIAS_LIMIT
        temperature_derating_pct: 15
        lifecycle_derating_pct: 12.5
        basis: exact_primary_reference_sheet_fail_closed
        evidence: >-
          Murata exact reference sheet guarantees identity, nominal tolerance
          and X7R class but directs the user to an approval sheet and actual-use
          confirmation for voltage and aging behavior. Its exact endurance
          test bounds post-test capacitance change to 12.5%, but no exact
          guaranteed DC-bias lower bound at 5 V is supplied in the packet.
  - &tps62825_input
    name: TPS62825 U_3V3X input
    requirement_uF: 3
    requirement_evidence: TI SLVSEF9I minimum effective input capacitance.
    accepted_dielectrics: [x5r]
    contributors:
      - part: GRM21BR61C106KE15L
        refs: [C_U_3V3X_IN_1, C_U_3V3X_IN_2]
        nominal_each_uF: 10
        dielectric: x5r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY
        temperature_derating_pct: 15
        lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE
        basis: exact_primary_typical_curve_fail_closed
        evidence: >-
          Exact Murata sheet labels all curves typical. About 45% retention at
          5 V is useful for a screen but is not a guaranteed lower bound; its
          AC curve is also typical and no aging guarantee is stated.
  - <<: *tps62825_input
    name: TPS62825 U_1V8 input
    contributors:
      - {part: GRM21BR61C106KE15L, refs: [C_U_1V8_IN_1, C_U_1V8_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY, temperature_derating_pct: 15, lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE, basis: exact_primary_typical_curve_fail_closed, evidence: "Same exact 5 V input-bank condition and evidence as U_3V3X."}
  - <<: *tps62825_input
    name: TPS62825 U_CORE input
    contributors:
      - {part: GRM21BR61C106KE15L, refs: [C_U_CORE_IN_1, C_U_CORE_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY, temperature_derating_pct: 15, lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE, basis: exact_primary_typical_curve_fail_closed, evidence: "Same exact 5 V input-bank condition and evidence as U_3V3X."}
  - &tps62825_output
    name: TPS62825 U_3V3X output
    requirement_uF: 10
    requirement_evidence: TI SLVSEF9I Table 8-3 minimum effective capacitance in the nominal 47 uF class.
    accepted_dielectrics: [x5r]
    contributors:
      - part: GRM21BR60J226ME39L
        refs: [C_U_3V3X_OUT_1, C_U_3V3X_OUT_2]
        nominal_each_uF: 22
        dielectric: x5r
        tolerance_minus_pct: 20
        dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY
        temperature_derating_pct: 15
        lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE
        basis: exact_primary_typical_curve_fail_closed
        evidence: >-
          Exact Murata sheet labels all curves typical. About 54% retention at
          3.3 V is a screen, not a guaranteed lower bound; the exact AC curve
          and temperature curve are also typical and no aging rate is stated.
  - <<: *tps62825_output
    name: TPS62825 U_1V8 output
    contributors:
      - {part: GRM21BR60J226ME39L, refs: [C_U_1V8_OUT_1, C_U_1V8_OUT_2], nominal_each_uF: 22, dielectric: x5r, tolerance_minus_pct: 20, dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY, temperature_derating_pct: 15, lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE, basis: exact_primary_typical_curve_fail_closed, evidence: "Lower DC bias improves the typical screen, but no guaranteed lower bound is provided."}
  - <<: *tps62825_output
    name: TPS62825 U_CORE output
    contributors:
      - {part: GRM21BR60J226ME39L, refs: [C_U_CORE_OUT_1, C_U_CORE_OUT_2], nominal_each_uF: 22, dielectric: x5r, tolerance_minus_pct: 20, dc_bias_derating_pct: UNBOUNDED_MURATA_LABELS_CURVE_TYPICAL_ONLY, temperature_derating_pct: 15, lifecycle_derating_pct: UNBOUNDED_NO_EXACT_AGING_RATE, basis: exact_primary_typical_curve_fail_closed, evidence: "Lower DC bias improves the typical screen, but no guaranteed lower bound is provided."}

rails:
  - {name: N5V_BUCK, vin_min: 11.196, vin_max: 13.2, vout_min: 4.95, vout_max: 5.05, iout_max_A: 1.9, converter: TPSM63603V5RDHR, eff: 0.85, external_output: false}
  - {name: N3V3X, vin_min: 4.95, vin_max: 5.05, vout_min: 3.267, vout_max: 3.333, iout_max_A: 1.0, converter: TPS6282533DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N1V8, vin_min: 4.95, vin_max: 5.05, vout_min: 1.782, vout_max: 1.818, iout_max_A: 0.30, converter: TPS6282518DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N0V9, vin_min: 4.95, vin_max: 5.05, vout_min: 0.88, vout_max: 0.92, iout_max_A: 1.2, converter: TPS62825DMQR, input_parent: N5V_BUCK, eff: 0.85, external_output: false}
  - {name: N3V3_ADC, vin_min: 4.10, vin_max: 5.05, vout_min: 3.23, vout_max: 3.35, iout_max_A: 0.23, converter: LT3041ADE#TRPBF, input_parent: N5V_BUCK, dropout_mv: 500, pdiss_max_mw: 702, eff: 0.65, external_output: false}
  - &spoke
    name: N12V_POD1
    stage: distribution
    vin_min: 11.196
    vin_max: 13.2
    vout_min: 10.8
    vout_max: 13.2
    iout_max_A: 0.10
    external_output: true
    claim_id: eight_analog_spokes
    load_uv_threshold: 10.8
    margin: 0.20
    margin_basis: requirement_boundary_only
    margin_evidence: >-
      The 10.8 V connector-plane floor is the requirement. Only the retained
      branch PPTC maximum is quantified; missing copper/joint/contact resistance
      deliberately leaves zero proven delivery headroom.
    distribution:
      series_devices: [1812L035-60MR]
      path_resistance_max_mohm: 1700
      current_limit_min_A: 0.10
      current_limit_max_A: UNBOUNDED_PPTC_TRIP_CURRENT_IS_NOT_A_HARD_LIMIT
      reverse_current_policy: External pods contain no admitted source; hot plug and downstream backfeed are prohibited.
  - {<<: *spoke, name: N12V_POD2}
  - {<<: *spoke, name: N12V_POD3}
  - {<<: *spoke, name: N12V_POD4}
  - {<<: *spoke, name: N12V_POD5}
  - {<<: *spoke, name: N12V_POD6}
  - {<<: *spoke, name: N12V_POD7}
  - {<<: *spoke, name: N12V_POD8}
