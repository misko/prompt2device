# E-CAP independently accepted source engineering screen. Numeric terms are conservative design bounds,
# not supplier guarantees. Exact characteristic plots establish typical
# centers; the declared adverse reserves are more severe, and first article
# must still verify startup, ripple and load-step stability. No service life is
# specified, so lifecycle percentages are engineering reserves rather than
# lifetime guarantees.
effective_capacitance_banks:
  - name: TPSM63603 N12V_PROTECTED input
    requirement_uF: 9.4
    requirement_evidence: >-
      Project conservative effective floor derived from TI SLVSFS5A's
      two-4.7-uF nominal ceramic input recommendation; TI does not label
      9.4 uF as an effective-capacitance minimum.
    accepted_dielectrics: [x7r]
    contributors:
      - part: 12105C106K4Z2A
        refs: [C_IN1, C_IN2, C_IN3]
        nominal_each_uF: 10
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 40
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_engineering_bound
        evidence: >-
          Exact Kyocera AVX K-tolerance PDF gives 10 uF +/-10%, 50 V and X7R.
          Its typical 13.2 V DC/AC screen retains about 80%; this candidate
          instead retains only 60% for combined voltage effects, the full 15%
          X7R temperature allowance, and a separate chosen 10% lifecycle
          reserve. Three parts give 12.393 uF. The plot remains typical and the
          reserve is an engineering bound, not a guaranteed production limit.
  - name: TPSM63603 N5V_BUCK output
    requirement_uF: 25
    requirement_evidence: TI SLVSFS5A section 8.2.1.2.5 requires 25 uF effective output capacitance.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_OUT1, C_OUT2, C_OUT3]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 70
        temperature_derating_pct: 0
        lifecycle_derating_pct: 12.5
        basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves
        evidence: >-
          Murata SimSurfing exact-base-part simple model at -55 C and 5.099 V
          gives 14.7 uF per part, or 31.3% nominal. For the new 5.13 V
          engineering ceiling, retain only 30% as a more adverse proxy;
          direct model/lot proof at 5.13 V remains owed. Temperature is already
          included, so the separate temperature factor is zero. Three parts
          estimate 33.31 uF after 10% initial-tolerance and selected 12.5%
          lifecycle reserves. Model and reserves are not production guarantees;
          independent evidence and startup/load-step stability are owed.
  - &tps62822_input
    name: TPS62822 U_3V3X input
    requirement_uF: 3
    requirement_evidence: TI SLVSDV6C section 9 minimum 3uF effective input capacitance.
    accepted_dielectrics: [x5r]
    contributors:
      - part: CL21A106KOQNNNE
        refs: [C_U_3V3X_IN_1, C_U_3V3X_IN_2]
        nominal_each_uF: 10
        dielectric: x5r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 70
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          Samsung exact-family official typical curves at 5.13 V give 47.21% DC
          retention; its separate 0.01-V AC curve gives 70.55%. Their 33.31%
          product is not a joint PVT guarantee. Use a more adverse selected 30%
          combined engineering retention, then -10% initial tolerance, -15%
          temperature and -10% lifecycle factors: two parts estimate 4.131uF
          against TI's 3uF minimum. The X5R +85C package limit, lot capacitance,
          input ripple, startup and transient remain first-article qualifications.
  - <<: *tps62822_input
    name: TPS62822 U_1V8 input
    contributors:
      - {part: CL21A106KOQNNNE, refs: [C_U_1V8_IN_1, C_U_1V8_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 70, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same Samsung typical-curve 5.13 V screen and selected 30% combined engineering retention as U_3V3X; 4.131uF estimated, not a joint PVT guarantee."}
  - <<: *tps62822_input
    name: TPS62822 U_CORE input
    contributors:
      - {part: CL21A106KOQNNNE, refs: [C_U_CORE_IN_1, C_U_CORE_IN_2], nominal_each_uF: 10, dielectric: x5r, tolerance_minus_pct: 10, dc_bias_derating_pct: 70, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_combined_voltage_engineering_bound, evidence: "Same Samsung typical-curve 5.13 V screen and selected 30% combined engineering retention as U_3V3X; 4.131uF estimated, not a joint PVT guarantee."}
  - &tps62822_output
    name: TPS62822 U_3V3X output
    requirement_uF: 5
    requirement_evidence: TI SLVSDV6C section 9 requires 5 uF minimum effective output; Table 3 marks 0.47 uH plus 47 uF nominal for TPS62822.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GRM32ER71A476KE15L
        refs: [C_U_3V3X_OUT_1]
        nominal_each_uF: 47
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 69
        temperature_derating_pct: 0
        lifecycle_derating_pct: 12.5
        basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves
        evidence: >-
          For revised 3.394 V maximum, the retained exact Murata -55 C model
          at the more adverse 5.05 V bias gives 14.7 uF typical. Rounded-down
          31% nominal retention with 10% initial tolerance and 12.5% lifecycle
          reserve estimates 11.48 uF; model points are not guarantees.
          Temperature is included in the model. One 47-uF part restores TI's
          marked nominal 0.47-uH/47-uF LC combination; retained inductor,
          distributed capacitance, startup and load-step stability remain owed.
  - <<: *tps62822_output
    name: TPS62822 U_1V8 output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_1V8_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves, evidence: "At the revised 1.899 V upper DC screen, the existing exact Murata -55 C model point at higher 3.38 V gives 16.9 uF; conservative rounded 35% nominal retention with initial-tolerance and lifecycle reserves estimates 12.95 uF. Temperature is already in the model. Nominal 0.47-uH/47-uF combination is marked in TI Table 3; physical stability proof remains owed."}
  - <<: *tps62822_output
    name: TPS62822 U_CORE output
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_U_CORE_OUT_1], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves, evidence: "Exact Murata -55 C / 0.92 V simple model gives 18.7 uF; conservative rounded 35% nominal retention with initial-tolerance and lifecycle reserves estimates 12.95 uF. Temperature is already in the model. Nominal 0.47-uH/47-uF combination is marked in TI Table 3; physical stability proof remains owed."}
  - name: LT3045 input
    requirement_uF: 4.7
    requirement_evidence: ADI LT3045 Rev.D p18 requires at least 4.7 uF at IN.
    accepted_dielectrics: [x7r]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_IN], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 70, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves, evidence: "Exact Murata -55 C / 5.099 V simple model gives 14.7 uF; more adverse 30% retained proxy at 5.13 V with initial tolerance and selected lifecycle reserve estimates 11.10 uF. Temperature is in the model; input-loop damping and production lot-characteristic qualification remain owed."}
  - name: LT3045 output
    requirement_uF: 10
    requirement_evidence: ADI LT3045 Rev.D pp13,16 requires at least 10 uF with ESR below 20 milliohm and assembled ESL below 2 nH.
    accepted_dielectrics: [x7r]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_OUT_1, C_LDO_OUT_2], nominal_each_uF: 47, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 65, temperature_derating_pct: 0, lifecycle_derating_pct: 12.5, basis: murata_exact_part_typical_model_with_reviewed_engineering_reserves, evidence: "Exact Murata -55 C / 3.38 V model gives 16.9 uF each; rounded 35% retention with tolerance/lifecycle reserves estimates 25.91 uF for pair. 125 C model gives 0.657 nH and 2.13 milliohm per part; ideal parallel is 0.3285 nH and 1.065 milliohm. P3 quiet_power must independently prove all shared interconnect below the remaining 1.6715 nH for assembled ESL strictly below 2 nH, with Kelvin OUTS and common SET/output ground; neither model values nor board ESL are production guarantees. First-article startup/load-step stability and lot-characteristic review remain owed."}
  - name: XU316 USB VBUS sense capacitance
    requirement_uF: 1
    requirement_evidence: XMOS self-powered reference requires 1-10 uF at connector VBUS.
    accepted_dielectrics: [x7r]
    contributors:
      - part: GCM21BR71C475KA73L
        refs: [C_USB_VBUS]
        nominal_each_uF: 4.7
        dielectric: x7r
        tolerance_minus_pct: 10
        dc_bias_derating_pct: 64
        temperature_derating_pct: 15
        lifecycle_derating_pct: 10
        basis: conservative_combined_voltage_engineering_bound
        evidence: >-
          Exact Murata typical curves are bracketed at the worse 6 V point for
          the 5.25 V USB ceiling (60% DC retention) and the lowest plotted AC
          drive (60% AC retention). Their product is 36% combined retention,
          represented here as 64% combined voltage derating. With tolerance,
          full X7R temperature allowance and a separate 10% lifecycle reserve,
          the estimate is 1.164942 uF. The curves are typical, the reserves are
          engineering bounds, and first-article measurement remains required.
  # TLV320ADC6140 internal AREG/DREG/VREF local bypass and AC coupling are
  # selected in the TSX/part dossier. TI Figure 172 gives nominal capacitor
  # values; do not promote them into guaranteed effective minima without an
  # exact-part bias/temperature screen. VREF alone has an explicit >=1uF
  # manufacturer minimum and its 10uF selected part requires longer quick charge.
  - &tlv_vref_bypass
    name: TLV320ADC6140 A VREF bypass
    requirement_uF: 1
    requirement_evidence: TI SBAS992A VREF external capacitor recommendation/minimum; 10uF nominal exact C0805C106K8RACTU is selected per die.
    accepted_dielectrics: [x7r]
    contributors:
      - {part: C0805C106K8RACTU, refs: [C_ADC_A_VREF_10U], nominal_each_uF: 10, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_engineering_screen_pending_exact_bias_model, evidence: "At VREF about 2.75V, 50% combined DC/AC retention and full -15% X7R temperature, -10% initial and -10% lifecycle factors estimate 3.4425uF per 10uF device; this is a project screen, not a production guarantee. Confirm KEMET exact-part data and charge/settle waveform before release."}

  - <<: *tlv_vref_bypass
    name: TLV320ADC6140 B VREF bypass
    contributors:
      - {part: C0805C106K8RACTU, refs: [C_ADC_B_VREF_10U], nominal_each_uF: 10, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_engineering_screen_pending_exact_bias_model, evidence: "Same 3.4425uF per-device engineering screen as ADC A; exact-part model and charge waveform still required."}

