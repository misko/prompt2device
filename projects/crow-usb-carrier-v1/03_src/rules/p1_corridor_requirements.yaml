power_boundary_windows:
  owner: board_integration
  coverage_nets: [CHASSIS, GND, N0V9, N12V_PROTECTED, N1V8, N3V3X, N3V3_ADC, N5V_BUCK, N5V_LDO_HOLD, PWR_EN]
  endpoints: {source: ../modular_plan.json#/interfaces}
  status: INCOMPLETE
  endpoint_evidence:
    CHASSIS:
      native_required_pads: [J1.9, J1.10, J2.9, J2.10, J3.9, J3.10, J4.9, J4.10,
        J5.9, J5.10, J6.9, J6.10, J7.9, J7.10, J8.9, J8.10]
      proof: each listed native pad must be net CHASSIS; RJ45 shell copper remains distinct from GND
    usb_shield:
      net: GND
      native_required_pads: [J_USB.SH]
      multiplicity: 4
      proof: all four physical J_USB.SH pads must be net GND; USB shield is a local GND feature, not CHASSIS
  geometry:
    schema: crow-power-boundary-windows-v1
    coordinate_system: board-mm-bbox-[x0,y0,x1,y1]
    status: INCOMPLETE
    semantics: source-reservation-envelope-not-copper-lane-or-current-thermal-proof
    windows:
      - {id: gnd_input_return, net: GND, bbox: [25, 85, 70, 110], role: input-buck-local-return-reservation}
      - {id: gnd_hold_return, net: GND, bbox: [24, 105, 126, 137], role: held-bank-and-quiet-power-return-reservation}
      - {id: gnd_adc_return, net: GND, bbox: [125, 85, 145, 125], role: ldo-adc-local-return-reservation}
      - {id: gnd_digital_return, net: GND, bbox: [145, 85, 185, 134], role: regulator-and-digital-local-return-reservation}
