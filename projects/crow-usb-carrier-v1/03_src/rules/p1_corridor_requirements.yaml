    owner: board_integration
    coverage_nets: [USB_DP, USB_DN, VBUS_USB, VBUS_PRESENT_N]
    endpoint_owners: [usb_frontend, usb_vbus_sense, xmos_core]
    endpoints:
      USB_DP: {usb_frontend: [J_USB.12, J_USB.4, U_USB_ESD.1], xmos_core: [U_XU.60]}
      USB_DN: {usb_frontend: [J_USB.13, J_USB.5, U_USB_ESD.2], xmos_core: [U_XU.59]}
      VBUS_USB: {usb_frontend: [C_USB_VBUS.1, J_USB.10, J_USB.15, J_USB.2, J_USB.7, R_USB_VBUS_BLEED.1, U_USB_VBUS_ESD.3], usb_vbus_sense: [R_VBUS_B.1]}
      VBUS_PRESENT_N: {usb_vbus_sense: [Q_VBUS.3, R_VBUS_PU.2], xmos_core: [U_XU.8]}
    demands:
      - {id: usb_pair, nets: [USB_DP, USB_DN], layers: [F.Cu], slots: 1, slot_pitch_mm: 0.97, pair_center_spacing_mm: 0.56, required_width_mm: 0.97}
      - {id: usb_local_power, nets: [VBUS_USB, VBUS_PRESENT_N], status: INCOMPLETE, reason: local entry and sense geometry unallocated}
    geometry: null
    limited_endpoint_evidence:
      source: ../../01_docs/research/2026-09-24-usb-fcu-launch-diagnostic-summary.json
      fact: isolated direct F.Cu U_XU launch diagnostic added eight scratch track segments and zero vias
      does_not_prove: [J_USB_to_ESD_to_XU_corridor, return, impedance, SI, decoupling, routing, p1_acceptance]

