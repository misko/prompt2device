# P1 source requirements. This is not routed copper, P1 acceptance, or P3 authorization.
schema: 1
kind: crow-p1-corridor-requirements
status: INCOMPLETE
endpoint_authority: ../modular_plan.json#/interfaces
native_measurement_tool: ../../../../skills/kicad-pcb/scripts/p1_corridor_capacity.py
# P1 mechanical/edge authority. The 16 hold-bank poses are fixed by ADR 0011;
# other anchored electronic support parts remain P2-movable for coarse screens.
p1_fixed_refs:
  - J1
  - J2
  - J3
  - J4
  - J5
  - J6
  - J7
  - J8
  - J_PWR
  - J_USB
  - J_JTAG
  - C_HOLD1
  - C_HOLD2
  - C_HOLD3
  - C_HOLD4
  - C_HOLD5
  - C_HOLD6
  - C_HOLD7
  - C_HOLD8
  - C_HOLD9
  - C_HOLD10
  - C_HOLD11
  - C_HOLD12
  - C_HOLD13
  - C_HOLD14
  - C_HOLD15
  - C_HOLD16
return_requirement: {net: GND, proof: continuous native filled reference plane under each signal lane}
receipt_requirements:
  board_sha256: required
  expected_contract_sha256: required
  coarse_boundary_witnesses: required
  exact_ref_pad_net_pockets: P3_required
  native_outline_rule_area_pour_check: required
  p1_accepted_must_remain_false: true

