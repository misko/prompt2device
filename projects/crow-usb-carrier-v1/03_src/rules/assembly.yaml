# Crow USB assembly design intent. Exact schema is owned by the skill.
# These selections are quotation/design inputs; no order has been placed.
#
# PCBA IS THE DELIVERABLE (see pcb-design/SKILL.md). This file is the ONE
# machine-readable home for "who gets placed, and why not". The ASSEMBLY gate
# battery reads it:
#   A-POP   — the population set is DECLARED, not emergent:
#             {board footprints} − {CPL designators} MUST equal `not_assembled`
#             (`assembly_coverage.py <proj>`)
#   A-STOCK — a release seals only against stock evidence that PASSES, or a
#             `sourcing_plan:` entry naming the measured stock and its date
#             (`release_freshness_check.py <release_dir>` check (e))
#   A-ROT   — PLANNED, held 2026-07-25: every CPL rotation MEASURED, never
#             inherited. Held because `jlc_twin.xform()` has a handedness bug
#             that NEGATED every reported offset (see design-policies.md
#             "Assembly"). This file will supply the not-assembled set so
#             coded-but-unplaced parts are still checked when it lands.
#
# WHY THIS FILE EXISTS. Before it, "not assembled" was a SENTENCE in the release
# MANIFEST that no code read, and the two artifacts disagreed in the field:
#   - cooksense v1.1 sealed with 13 CPL placement rows whose BOM line has a
#     BLANK LCSC. Its MANIFEST declares 12 of them not_assembled (the 13th,
#     J_TC, is declared nowhere) — so JLC was told to PLACE 12 parts the
#     manifest says are not assembled, and to source a part with no code.
#   - the cooksense interposer v1.0 sealed with a blank-LCSC BOM row whose refs
#     are ALSO on the CPL, no not_assembled line at all, and a disposition that
#     is PROSE telling a human to delete rows before uploading. Every gate green.
# An unpopulated part is a DEFECT WITH A DECISION RECORD, never a free outcome.
#
# THE MANIFEST `not_assembled:` LINE IS GENERATED FROM THIS FILE. Never hand-write
# it in two places — that is how the two drifted apart in the first place.

# ---- SERVICE DECLARATION (required; declaration-only until the capability
# reference is fetched — do NOT gate on numbers written from memory) ----------
service: standard          # selected JLC assembly service intent; not an order
# Allowed mounting sides for all fitted SMD, including manual/consigned parts.
sides: [top]               # sides that carry placed parts. Adding `bottom` is a
                           # COST and process decision, not a layout convenience.
fiducials: none            # `none` + the fab's own statement, or a count/type.
                           # JLC adds fiducials for SMT orders on their rails;
                           # LOCAL fiducials beside <=0.4mm-pitch parts are YOUR
                           # job and cannot be added later. Silence is not allowed:
                           # state `none` deliberately or declare what you placed.
build_quantity: 5          # quantity-expanded JLC PCBA checks bind to this
sourcing_authority: public-observations  # D11: public design screen only; order-time uploader check remains
public_stock_surplus: 150  # D7 user-confirmed absolute buffer per aggregated LCSC line
public_stock_surplus_overrides:
  - {lcsc: C6362698, mpn: XU316-1024-TQ128-C24, surplus: 0, directive: D10}

pcb_process: "Proposed JLC advanced order: selectively fill/cap the complete 0.20 mm drill family for LT3045 EP and TMUX4827 B2; uploader/vendor acceptance required"
via_process:
  named_profiles:
  - id: TMUX4827_YBH_B2_POFV
    kind: tmux4827_ybh_b2_pofv_v1
    tier: jlc_4layer_advanced
    finish: ENIG
    refs: [U_ISO1, U_ISO2, U_ISO3, U_ISO4, U_ISO5, U_ISO6, U_ISO7, U_ISO8]
    pad: '5'
    net: GND
    expected_count: 8
    geometry: {pad_diameter_mm: 0.35, via_diameter_mm: 0.35, drill_mm: 0.20, annulus_mm: 0.075, mask_opening_mm: 0.25, paste_opening_mm: 0.25, bga_via_to_pad_gap_mm: 0.10, perimeter_pad_gap_mm: 0.15}
    process: type_vii_filled_and_capped_pofv
    evidence:
      part: 02_parts/TMUX4827YBHR/part.yaml
      coupon_sha256: 6f39a73aad46444e6b2256ced0b64a1dea5b9792801c3f705f8b691727ce83b6
  protected_geometries:
  - {via_diameter_mm: 0.50, drill_mm: 0.20}  # six existing U_LDO EP vias
  - {via_diameter_mm: 0.35, drill_mm: 0.20}  # eight U_ISO B2 center vias
  fabricator_selector:
    kind: drill_family
    protected_drill_mm: 0.20
    ordinary_drill_mm: [0.30]
  order_remark: >-
    Fill and copper-cap the complete 0.20 mm drill family only: both 0.50 mm
    U_LDO EP and 0.35 mm U_ISO B2 copper diameters. Do not fill or
    cap the ordinary 0.30 mm drill family. Request selective Type VII process in
    the JLCPCB uploader and retain exact vendor acceptance before payment; stop
    if the uploader does not accept it.
  uploader_confirmation_required: true

# ---- SELECTIVE VIA-IN-PAD PROCESS (required when any via centre is in an SMT
# land, or any board via carries native fill/cap flags) ----------------------
# Electrical DRC deliberately permits same-net overlap; it does NOT approve an
# open barrel beneath solder paste. `via_process_check.py` independently scans
# the exact final board, requires every via-in-pad site filled+capped, and
# refuses native KiCad protection flags unless the order contract can select a
# drill family disjoint from ordinary vias. Do not rely on item flags alone:
# Gerber/drill outputs do not carry them to the fabricator.
# pcb_process: "JLC advanced; selective filled/capped via-in-pad"
# via_process:
#   source: "03_src/floorplan.yaml thermal_vias.protection"
#   protected_geometry: {via_diameter_mm: 0.45, drill_mm: 0.25}
#   fabricator_selector:
#     kind: drill_family
#     protected_drill_mm: 0.25
#     ordinary_drill_mm: [0.20, 0.30]
#   ordinary_vias: "ordinary drill families inherit board defaults; no fill/cap"
#   order_remark: >-
#     Fill and copper-cap the complete 0.25 mm drill family only. Do not fill
#     or cap ordinary 0.20 mm or 0.30 mm drill routing/stitching vias.
#   uploader_confirmation_required: true

# ---- NOT ASSEMBLED (the population set) ------------------------------------
# Every ref here MUST also carry FP_EXCLUDE_FROM_POS_FILES on the board, so it
# leaves the CPL. Declaring it here but leaving it on the CPL is a FAIL: the
# declaration and the machine instruction must agree.
#
# `reason:` is a CLOSED VOCABULARY — if none fits, the honest answer is that the
# part should be re-specified to a placeable one:
#   not_in_catalog  JLC does not carry it. `evidence:` = the catalog query + result.
#   consign         YOU ship the part, JLC PLACES it. NOTE: consigned parts are
#                   POPULATED — they stay ON the CPL and belong in `consigned:`
#                   below, NOT here. Listing a consigned part as not_assembled
#                   conflates a sourcing class with a population class.
#   user_supplied   fitted by the end user after delivery (fuse element, jumper).
#   dnp_by_design   footprint deliberately unstuffed (option strap, alt-BOM).
#   mechanical      no electrical function (standoff, shield can pad).
#   test_point      probe pad with no part.
#
# `evidence:` must be a DATED MEASUREMENT, not a rationale. "hand-solder" is a
# sourcing wall you PROVE you hit — a searched-and-absent catalog result — not a
# style preference.
#
# OPTIONAL per entry: `lcsc:` — the code of a part that IS in the catalog but
# is deliberately not placed (a user-fitted fuse element, a DNP option strap).
# `jlc_twin --assembly` reads it and checks/renders those bodies, which is what
# `--also REF=LCSC` used to be hand-typed for. One home, no drift.
#
# OPTIONAL per entry: `on_bom: false` — the part leaves the ASSEMBLY BOM as well
# as the CPL. Default is true: not being PLACED and not being SOURCED are
# different decisions, and most unplaced parts still ship with the order.
# `export_jlc_package.py` reads it and drops the row; a ref that is both
# `on_bom: false` and on the CPL BLOCKS the export (exit 4), because that is
# the dangerous inversion — JLC told to place a part with no line to source it.
#
#   USE IT when JLC is asked NEITHER to place NOR to source the part: you supply
#   it and hand-solder it. A row JLC cannot match (blank LCSC, or a consign-only
#   placeholder code at stock 0) stalls the WHOLE upload at its BOM/CPL matcher —
#   crow-mic-pod-v2 v1.0 shipped MK1 with its MPN *and* LCSC both empty.
#   DO NOT USE IT when the part ships with the order and is merely hand-fitted:
#   usb-hub-3s-v3's F1 fuse HOLDER is `user_supplied`, coded, stocked, and STAYS
#   on the BOM (only the fuse ELEMENT is bought locally).
#   That contrast is why this is its own key and NOT inferred from `reason:` —
#   both boards say `user_supplied` and want opposite BOM answers.
#
#   HISTORY: crow-mic-pod-v2 v1.1 made this removal by EDITING fab/bom.csv, so
#   the sealed BOM was not reproducible from source (canon M3) — re-running the
#   exporter put both rows straight back. The key landed at v1.3 (2026-07-27).
# D5 (BRIEF.md, 2026-09-23) supersedes the former secondary-assembler ADC
# exception. All non-through-hole parts must be in stock at and placed by JLC.
# No exemption may hide the unresolved U_ADC sourcing/architecture backtrack.
not_assembled:
- refs:
  - J1
  - J2
  - J3
  - J4
  - J5
  - J6
  - J7
  - J8
  reason: user_supplied
  lcsc: C6461980
  on_bom: false
  evidence: '2026-09-23 exact public distributor observation: DigiKey 615008160221
    stock 991 versus 190 for five boards plus 150. JLC catalog shortfall and exact
    URLs recorded in 01_docs/sourcing/tht-manual-source-2026-09-23.md; user D9 selects
    manual THT assembly.'
  disposition: Source separately and hand-solder after JLC SMD assembly. Retain in
    full design/fitted population; omit from JLC BOM and CPL. No purchase authorized.
- refs:
  - C_A1N
  - C_A1P
  - C_A2N
  - C_A2P
  - C_A3N
  - C_A3P
  - C_A4N
  - C_A4P
  - C_A5N
  - C_A5P
  - C_A6N
  - C_A6P
  - C_A7N
  - C_A7P
  - C_A8N
  - C_A8P
  reason: user_supplied
  lcsc: C3778009
  on_bom: false
  evidence: '2026-09-23 exact public distributor observation: DigiKey R82DC4100CK60J
    stock 969 versus 230 for five boards plus 150. JLC catalog shortfall and exact
    URLs recorded in 01_docs/sourcing/tht-manual-source-2026-09-23.md; user D9 selects
    manual THT assembly.'
  disposition: Source separately and hand-solder after JLC SMD assembly. Retain in
    full design/fitted population; omit from JLC BOM and CPL. No purchase authorized.
  # - refs: [K_U1, K_U2, K_U3]
  #   reason: not_in_catalog
  #   evidence: "LCSC search 'DIP05-1A72-12L' 2026-07-24 -> 0 results; Standex
  #              reed relay, DO-NOT-SUBSTITUTE per part.yaml (contact rating is
  #              the safety argument). JLC parts library queried same day."
  #   disposition: "hand-soldered at integration; ORDER_README section 3 lists them"
  # - refs: [F1]
  #   reason: user_supplied
  #   lcsc: C5249699
  #   evidence: "10A MINI blade fuse ELEMENT is user-fitted; the HOLDER (C5249699)
  #              IS assembled. Checked 2026-07-23."
  #   disposition: "purchasing list ships the element loose"
  # - refs: [H1, H2, H3, H4]
  #   reason: mechanical
  #   evidence: "M3 mounting holes, no footprint pads with nets (board 2026-07-24)"
  #   disposition: "n/a"

# D5 keeps U_ADC on the JLC placement list. D9 THT position exclusions are authored in floorplan.yaml; no board-attribute deferral.
board_attr_plan: []

# ---- CONSIGNED (you supply, JLC PLACES — these stay ON the CPL) -------------
# A consigned part is ASSEMBLED. It needs the same rotation rigor as any other
# placed part — more, in fact: crow-recorder-central-v2 v1.2 shipped its
# CONSIGNED 0.4mm-pitch TQFP-128 at CPL 270 when the twin measured 90 (180 deg
# off), and consigned parts are the ones you cannot cheaply replace.
#
# `msl:` is REQUIRED for consigned parts and for any part with an exposed pad:
# JLC cannot bake what they do not know is moisture-sensitive. Read it from the
# datasheet (a fourth datasheet read, budgeted at part selection) and cite it.
# crow-recorder-central v1.0 shipped a consigned MSL-3 XU316 with zero MSL text
# in the order paperwork while its own part.yaml recorded "MSL 3, 168h floor life".
consigned:
  # - refs: [U1]
  #   lcsc: C6938291
  #   msl: "MSL 3, 168h floor life (XMOS XU316 ds v2.0.0 sec.15.2, read 2026-07-23)"
  #   evidence: "supplied from stock on hand, 5 pcs, 2026-07-24"
  #   disposition: "ORDER_README section 1b: ship with the order, bake if floor
  #                 life exceeded; JLC places"

# ---- SOURCING PLAN (justifies a non-OK stock line at seal time) -------------
# A-STOCK fails on any coded, placed line whose stock evidence is not OK unless
# it appears here with a MEASURED number and a date. Five sealed releases in this
# fleet shipped stock evidence whose last line says FAIL — including one with the
# board's own CPU at stock 0 — because nothing ever read the verdict.
sourcing_plan:
  # - lcsc: C6938291
  #   measured_stock: 0
  #   measured_on: 2026-07-24
  #   plan: "consigned from stock on hand (see consigned: U1); JLC stock
  #          irrelevant for this line"
  # - lcsc: C2939728
  #   measured_stock: 120
  #   measured_on: 2026-07-24
  #   plan: "120 >= 5 boards x 1; single-source, no alternate qualified — accept
  #          for this build, qualify an alternate before any volume order"

# ---- EXEMPT REFDES CLASSES -------------------------------------------------
# Refdes prefixes whose absence from the CPL is expected and needs no per-ref
# entry above. DECLARED, never hardcoded in the checker: hardcoding an exemption
# is how the refdes-on-silk waiver became an inherited defect across three boards.
# Keep this list SHORT and justify additions in the project's assembly ADR.
exempt_prefixes: [H, TP, FID, MH]
