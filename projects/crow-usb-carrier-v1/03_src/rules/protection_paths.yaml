# Normal-input and transient protection coordination. Replace the null
# decision; use paths: [] only when the stated reason is true.
schema: 1
paths:
  - name: EXTERNAL_12V_INPUT
    source_operating_max_V: 13.2
    source_tolerance_included: true
    source_boundary_evidence: Compliant isolated source must deliver 11.4-13.2 V at J_PWR after cable loss under the declared 2.185 A one-fault screen.
    voltage_margin_pct: 12.0
    admitted_transient:
      claim: >-
        This is a component-compatibility screen, not full-product transient
        survival. D_IN is a local secondary pulse clamp. No IEC, automotive
        load-dump, lightning, or sustained-overvoltage immunity is claimed.
        Because spoke OVP is disabled, a positive pulse can propagate to every
        12V_POD output; product operation therefore admits no connector input
        above 13.2 V until exact pod pulse withstand is specified or spoke OVP
        is enabled. Any later pulse claim must fit the SMBJ15A 10/1000-us curve,
        fuse/source I2t envelope, and pod limit.
      input_damping: External source and cable impedance plus the local input capacitor bank; exact source prospective current and cable L/R are compliance-envelope inputs.
    tvs:
      part: SMBJ15A
      standoff_V: 15.0
      clamp_max_V: 24.4
      waveform_duration_ms: 1.0
      waveform: 10/1000 us
      peak_current_max_A: 24.6
      peak_power_max_W: 600
      evidence: Littelfuse SMBJ exact SMBJ15A row; clamp maximum applies at the tabulated 24.6 A pulse current, not continuously.
    exposed:
      - {ref: Q_IN, part: DMP6023LFG-13, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 60, absolute_max_V: 60, evidence: 'Diodes DS37204 gives 60 V VDS maximum; 24.4 V clamp screen leaves 35.6 V.'}
      - {ref: U_BUCK, part: TPSM63603RDHR, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 36, absolute_max_V: 42, evidence: 'TI SLVSFS5A gives 3-36 V operating range and 42 V VIN absolute maximum.'}
      - {ref: U_SPOKE1-U_SPOKE8, part: TPS26625DRCR, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 60, absolute_max_V: 62, evidence: 'TI SLVSDT4F gives 4.5-60 V operating and 62 V absolute input.'}
      - {ref: C_IN1-C_IN3, part: 12105C106K4Z2A, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 50, absolute_max_V: 50, evidence: 'Exact Kyocera AVX dossier gives 50 V rating.'}
      - {ref: C_IN_HF, part: CC0805KRX7R9BB104, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 50, absolute_max_V: 50, evidence: 'Exact Yageo dossier gives 50 V rating; replaces the former 16 V part on this node.'}
      - {ref: C_SPOKE_IN1-C_SPOKE_IN8, part: CC0805KRX7R9BB104, domain: directly_tvs_clamped_input, bounded_max_V: 24.4, recommended_max_V: 50, absolute_max_V: 50, evidence: 'Exact Yageo dossier gives 50 V rating.'}
    series_overcurrent:
      part: 0451004.MRL
      rated_current_A: 4
      hot_continuous_screen_A: 2.85
      one_fault_screen_A: 2.185
      nominal_melting_i2t_A2s: 3.152
      interrupting_limit_A: 50
      source_capacitor_discharge_requirement: Source output capacitance plus cable inductance/resistance are included in the 3.4 A instantaneous episode cap at J_PWR; local post-fuse discharge remains first-article owed. Only the bounded external-source episode is admitted.
      source_capacitor_discharge_peak_A: 3.4
      post_fuse_cap_discharge_status: first_article_owed
      # The former 8–50 A fuse-clearing mode is retained only as historical
      # rationale: 8 A can heat Q_IN at 3.2 W for up to the fuse's 5 s maximum.
      # It is not an admitted source mode without a separate thermal proof.
      allowed_source_fault_modes: [bounded_external_source_episode]
      aggregate_source_episode:
        delivery_current_A: 2.185
        delivery_voltage_min_V: 11.4
        delivery_voltage_max_V: 13.2
        recovery_voltage_max_V: 13.2
        fault_instantaneous_peak_A: 3.4
        cumulative_excess_above_2p85_ms: 10
        persistent_fault_current_max_A: 2.85
        retry_rearm: no_excess_retry_until_input_power_cycle_after_fault_removal
        episode_scope: entire_fault_episode_including_cap_discharge_and_retries
        qualification_evidence_owed: Exact isolated supply and cable load-line, source/output-capacitor discharge and repeated-fault waveforms must be qualified before procurement or release; no supply is selected.
      requirements: Normal load, startup, and one branch-limited fault must not open F_IN. A shorted TVS or common-trunk fault must remain inside the bounded source episode. Fuse clearing is not admitted without separate Q_IN thermal/fuse coordination.
    downstream_consequence:
      spoke_ovp: disabled_by_OVP_to_RTN
      bounded_screen_V: 24.4
      capacitors: C_SPOKE_OUT1-C_SPOKE_OUT8 are 50 V rated CC0805KRX7R9BB104
      connector_load_status: UNQUALIFIED_ABOVE_13P2V
      design_rule: Do not claim product pulse survival above 13.2 V unless exact pod withstand is supplied or TPS26625 OVP is enabled and tolerance-checked below that withstand.

no_surge_exposed_paths: >-
  USB signal ESD and downstream connector transients are owned by their
  interface-specific protection. This path claims only the external 12 V input.

# A path records the source operating maximum including tolerance, the exact
# TVS standoff/clamp/waveform, voltage margin, and every exposed part's
# recommended/absolute maximum. Reliance above recommended maximum requires a
# measured or cited transient qualification covering voltage and duration.
# The TVS and every exposed row carry `part:` resolving to 02_parts; `ref:` is
# the board population/range using that exact dossier.
