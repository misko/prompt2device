# Crow USB exploratory placement canvas, not accepted placement.
# 220 x 120 mm permits initial modular studies; final outline remains open.
# Operated connector refs deliberately have no pose or region assignment.
# require_anchor rejects them until exact mating-plane anchors are reviewed.
# Region patterns only seed placement: they do not enforce a region boundary.
# Physical stackup authority is rules/rf.yaml and retained JLC evidence; the
# native stackup must be populated consistently before placement admission.
# Board generation remains prohibited by the commissioning hold.
