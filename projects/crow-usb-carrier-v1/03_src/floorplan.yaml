    y0: 20.0
    x1: 240.0
    y1: 140.0
  edge_width: 0.1
  layers: 4
  stackup:
    nominal_thickness_mm: 1.63
    thickness_tolerance_mm: 0.163
    copper_thickness_mm:
    - 0.04064
    - 0.0152
    - 0.0152
    - 0.04064
    dielectrics:
    - type: prepreg
      thickness_mm: 0.5124
      material: NP-155F 7628+7628+1080 composite; JLC04161H-7628G
      epsilon_r: 4.2366666667
      loss_tangent: 0.02
    - type: core
      thickness_mm: 0.5
      material: NP-155F core
      epsilon_r: 4.48
      loss_tangent: 0.02
    - type: prepreg
      thickness_mm: 0.5124
      material: NP-155F 7628+7628+1080 composite; JLC04161H-7628G
      epsilon_r: 4.2366666667
      loss_tangent: 0.02
    mask_thickness_mm: 0.01524
    dielectric_constraints: true
libraries:
- /usr/share/kicad/footprints
- 03_src/lib
thermal_vias:
  protection:
    capping: true
    filling: true
  fields:
  - ref: U_LDO
    pad: '11'
    size: 0.50
    drill: 0.20
    at: [[-0.575, -0.94], [-0.575, 0.0], [-0.575, 0.94],
         [0.575, -0.94], [0.575, 0.0], [0.575, 0.94]]
  # Each 3x3 TMUX4827 has one B2 ground via; outer eight balls launch outward.
