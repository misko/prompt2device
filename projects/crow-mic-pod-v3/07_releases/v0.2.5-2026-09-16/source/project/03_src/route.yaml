route:
  final: 03_src/route/final_chain.kicad_pcb
  import_source: promoted
  krt: /home/mouse9911/gits/KiCadRoutingTools-worktrees/cccv-5a1bdc4
  ownership_preflight:
    mode: enforce
  candidate_grade:
    mode: enforce
  wave_drc: true
  forbid_new_via_in_pad: true
  exploration_guard:
    mode: enforce
    plateau_attempts: 2
    max_attempts: 5
    max_novel_signatures: 3
    max_operation_amplification: 8
  preflight_critical_pairs: []
  no_critical_routes: All signals are ordinary audio or DC below 20 kHz and therefore have no controlled-impedance differential-pair
    timing contract. Connector-first clamp order, regulator bypass proximity and probe-stub limits are governed separately
    by the pod realized-route checker.
  common:
    layers:
    - F.Cu
    - B.Cu
    via_size: 0.6
    via_drill: 0.3
    fab_tier: standard
    no_stub_layer_swap: true
    no_power_tap_neckdown: true
    keepout: true
    keepout_layer: User.2
    clearance: 0.2
  race: 3
  kicad_python: /usr/bin/python3
  waves:
  - name: audio
    group: audio
    track_width: 0.26
    via_cost: 1000
    max_iterations: 800000
    max_probe_iterations: 60000
    max_ripup: 30
  - name: power
    group: power
    track_width: 0.5
    via_cost: 1000
    max_iterations: 500000
  - name: aux
    group: aux
    track_width: 0.26
    max_iterations: 500000
