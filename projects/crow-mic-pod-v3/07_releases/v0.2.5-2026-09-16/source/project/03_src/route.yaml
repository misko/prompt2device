    default: 600
    source_schema_governance: 60
    adr_bound_governance: 60
    tscircuit_deps: 120
    tscircuit_build: 180
    route_wave: 900
    route_race: 2400
    route_evaluate: 180
    route_import: 300
    stitch: 900
    rebuild: 1500
    layout_drc: 180
  blockers:
  - 'PROPOSED coherent candidate4: reviewed top-only carrier154x100/x21 mounts, exact carrier0.20/pod0.26 signals, rearward
    N launches and ordinary45-degree prefixes; complete source dependency correction with ADC returns. Fresh exact-source/native
    acceptance and normal owning gates remain owed; historical top-only candidates1..3 and ADC candidates1..2 remain spent.'
