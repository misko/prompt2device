  owner:
    stage: routing
    files:
    - 03_src/route.yaml
    - 03_src/floorplan.yaml
  copper:
    deterministic:
    - prep.seed_stubs
    - taps.connections
    - stitch.seed_stubs
    stochastic:
    - route.waves
  budgets_s:
    tscircuit_deps: 30
    tscircuit_build: 60
    escape_packages: 30
    escape_lands: 120
    tier_preflight: 15
    grind: 900
    rebuild: 1200
    layout_drc: 120
