  - heal_islands
  - gate
  canonicalize_chains:
    edits:
    - net: AUDIO_P
      layer: F.Cu
      width: 0.26
      reason: Retain the reviewed U3 launch and remove the router's overlapping replacement.
      remove:
      - [[48.712, 32.366999], [48.712, 34.241]]
