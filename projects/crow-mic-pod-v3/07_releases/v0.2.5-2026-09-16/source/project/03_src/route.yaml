      - [[47.288, 36.25], [47.8, 35.7]]
      - [[60.2, 35.2], [60.2, 36.8]]
      - [[62.9, 35.8], [62.913, 34.7]]
    - net: OUTP_DRV
      layer: F.Cu
      width: 0.26
      reason: Collapse two cap-only joints into exact shared route vertices.
      remove:
      - [[52.2, 25.0], [52.3, 25.0]]
      - [[52.3, 25.0], [53.7, 26.4]]
      - [[46.6, 26.3], [46.5, 26.2]]
