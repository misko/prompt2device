invariants:
  - {assert: pin_on_net, pin: "J1.1", net: 12V_POD, adr: "0001", why: "Frozen spoke pin 1 is pod power."}
  - {assert: pin_on_net, pin: "J1.2", net: GND, adr: "0001", why: "Frozen spoke pin 2 is the power/audio return."}
  - {assert: pin_on_net, pin: "J1.3", net: AUDIO_P, adr: "0001", why: "Frozen spoke pin 3 is the positive audio leg."}
  - {assert: pin_on_net, pin: "J1.4", net: AUDIO_N, adr: "0001", why: "Frozen spoke pin 4 is the negative audio leg."}
  - assert: series_chain
    chain: [12V_POD, F1, 12V_FUSED, D1, VIN_PROTECTED]
    adr: "0002"
    why: "The local PTC and low-leakage forward rectifier precede every pod load."
  - {assert: pin_on_net, pin: "D1.1", net: VIN_PROTECTED, adr: "0002", why: "1N4007 cathode faces the protected node."}
  - {assert: pin_on_net, pin: "D1.2", net: 12V_FUSED, adr: "0002", why: "1N4007 anode receives correctly polarized fused input."}
  - {assert: pin_on_net, pin: "D2.1", net: VIN_PROTECTED, adr: "0002", why: "SMBJ15A cathode clamps the protected positive rail."}
  - {assert: pin_on_net, pin: "U2.8", net: VIN_PROTECTED, adr: "0002", why: "TPS7A4901 input is protected."}
  - {assert: pin_on_net, pin: "U2.5", net: VIN_PROTECTED, adr: "0002", why: "TPS7A4901 enable is always on only after protection."}
  - {assert: pin_on_net, pin: "U2.1", net: 5V_QUIET, adr: "0002", why: "TPS7A4901 output owns the quiet rail."}
  - {assert: pin_on_net, pin: "U2.9", net: GND, adr: "0002", why: "TPS7A4901 exposed pad is grounded."}
  - {assert: net_has_part, net: VIN_PROTECTED, part_type: capacitor, min: 2, adr: "0002", why: "Protected input has local bulk and HF bypass."}
  - {assert: part_value, part: R14, equals: 4.7k, tolerance_pct: 1, adr: "0002", why: "The hot D1 reverse-leakage bound times R14 remains inside the TPS7A49 negative absolute limit."}
  - {assert: part_value, part: R1, equals: 324k, tolerance_pct: 1, adr: "0002", why: "LDO upper feedback resistor sets the governed rail window."}
  - {assert: part_value, part: R2, equals: 100k, tolerance_pct: 1, adr: "0002", why: "LDO lower feedback resistor sets the governed rail window."}
  - {assert: part_value, part: R3, equals: 3.9k, tolerance_pct: 1, adr: "0002", why: "Bias filter derives the characterized nominal 3 V microphone supply plane from 5V_QUIET."}
  - {assert: part_value, part: C7, equals: 100u, tolerance_pct: 20, adr: "0002", why: "Bias reservoir and R3 replace the archived 100 ohm/100 uF low-frequency rejection weakness."}
  - {assert: part_value, part: R4, equals: 2.2k, tolerance_pct: 1, adr: "0002", why: "Capsule loading matches the PUI sensitivity characterization circuit."}
  - {assert: part_value, part: R8, equals: 22k, tolerance_pct: 1, adr: "0003", why: "Preamp input resistance is the denominator of the 9/11 inverting magnitude gain."}
  - {assert: part_value, part: R9, equals: 18k, tolerance_pct: 1, adr: "0003", why: "Preamp feedback resistance fixes the 9/11 magnitude and the 18/11 differential gain."}
  - {assert: part_value, part: R10, equals: 10k, tolerance_pct: 1, adr: "0003", why: "Positive-leg polarity restore uses equal resistors."}
  - {assert: part_value, part: R11, equals: 10k, tolerance_pct: 1, adr: "0003", why: "Positive-leg polarity restore uses equal resistors."}
  - {assert: part_value, part: R12, equals: 100, tolerance_pct: 1, adr: "0003", why: "AUDIO_P source impedance is exactly governed."}
  - {assert: part_value, part: R13, equals: 100, tolerance_pct: 1, adr: "0003", why: "AUDIO_N source impedance is exactly governed."}
  - {assert: pin_on_net, pin: "U1.7", net: PRE_OUT, adr: "0003", why: "OPA1679 B channel produces the inverting preamp output."}
  - {assert: pin_on_net, pin: "U1.8", net: OUTP_DRV, adr: "0003", why: "OPA1679 C channel restores positive acoustic polarity."}
  - {assert: pin_on_net, pin: "R13.1", net: PRE_OUT, adr: "0003", why: "The already low-impedance U1B output drives the complementary leg without a second signal buffer."}
  - {assert: pin_on_net, pin: "U1.12", net: VREF, adr: "0003", why: "The spare D channel sees only the fixed in-range reference voltage."}
  - {assert: pin_on_net, pin: "U1.13", net: SPARE_BUF, adr: "0003", why: "The spare D channel closes local unity feedback on a private net."}
  - {assert: pin_on_net, pin: "U1.14", net: SPARE_BUF, adr: "0003", why: "The spare D output is parked as a private VREF follower and never parallels another output."}
  - {assert: pin_on_net, pin: "U3.3", net: AUDIO_P, adr: "0003", why: "ESD channel one clamps only AUDIO_P."}
  - {assert: pin_on_net, pin: "U3.5", net: AUDIO_N, adr: "0003", why: "ESD channel two clamps only AUDIO_N."}
