  - id: POD-RJ45-clamp-seed-identities
    state: open
    blocks_at_or_above: DESIGN_CLEAN
    owner: layout-source
    finding: "Normal reviewed-schematic continuation generated the current RJ45 board and passed placement DRC at0violations/58unconnected/0parity, then route preparation refused three source segments. The U3.4 GND start lands on U3.1 NC1; AUDIO_P ends on U3.5 AUDIO_N and AUDIO_N ends on U3.3 AUDIO_P. Authored coordinates disagree with the realized bottom-side pad map. No seed copper was saved and no routing/import ran. Current status: Exact three corrected source point lists adopted after timely author delivery and independent root geometry review. Candidate stock prep12banks/97primitives/0refusals, audio3.537339mm and3.584934mm B.Cu/0vias. Normal checkpoint and review renewal remains owed, so this finding stays open."
    closes_when: Correct only the three source-owned seed paths against independently measured native pad/net identities, retain all declared widths, clearance, layer, length and clamp-first restrictions, prove the old source rejected and the candidate accepted through unchanged prep/native consumers, then renew affected checkpoints/reviews normally. No placement or package change is implied.
    evidence:
      - 01_docs/journal/placement.md
      - 06_build/task_runs/rj45-pod-placement-after-recovery1/outputs/evidence.json
      - 01_docs/journal/eea4687b8abad52c8754dcaf5d408badbc8e6a076d8df7d7f7da85cf5e656eba.tar.gz
  - id: POD-RJ45-interface-revision
    state: open
    blocks_at_or_above: DESIGN_CLEAN
    owner: systems
    finding: Exact factory RJ45 source adopted at8a2d3620; current native schematics regenerated and both required topology/readability reviews adopted SOUND at2026-09-12T21:24Z. Owning PR-REVIEW grades2/2PASS for each board. Existing PCBs and sealed releases remain historical Micro-Fit; current RJ45 placement, routing, DRC, fabrication and release acceptance remain owed. Physical SOURCE/FULL distinction and prior investigation budgets remain unchanged.
    closes_when: Exact source and parent/carrier/pod contracts agree; regenerated schematic, board and routes pass all affected machine and independent review gates. Preserve the prior sealed release and issue a new release after acceptance.
  - id: POD-F1-live-jlc-prelayout
    state: open
    blocks_at_or_above: FIRST_ARTICLE_ORDERABLE
    owner: fabrication
    finding: The exact-code public screen admits design progression, but no authenticated JLCPCB response establishes assembly allocation, method or economics for every exact line; the design remains DO-NOT-ORDER.
    closes_when: The exact fabrication BOM is checked in the logged-in JLCPCB PCBA/BOM interface, provider exports or screenshots are retained, the resolved facts are transcribed without reinterpretation, and every row is accepted or deliberately changed before ordering.

  - id: POD-F2-full-source-policy
    state: closed
    blocks_at_or_above: DESIGN_CLEAN
    owner: electrical
    finding: The final exact dossiers and assembly selections pass the full source policy with zero FAIL; HUMAN and governed waiver dispositions remain explicit rather than being treated as supplier allocation.
    closes_when: The full policy audit is rerun on the final pre-placement source state and retains zero FAIL with every HUMAN item explicitly reviewed.
    evidence:
      - 06_build/policy_audit.md
      - 06_build/source_policy_audit.md

  - id: POD-F3-schematic-human-review
    state: closed
    blocks_at_or_above: DESIGN_CLEAN
    owner: electrical
    finding: Independent topology and rendered-schematic reviews are signed against the exact generated schematic and netlist with no unresolved P0/P1/P2 finding.
    closes_when: Both required schematic review records exist, bind the current artifacts and contain no unresolved finding.
    evidence:
      - 08_reviews/pre-route_topology.md
      - 08_reviews/pre-route_schematic_render.md

  - id: POD-F4-capsule-and-enclosure-mechanics
    state: open
    blocks_at_or_above: FIRST_ARTICLE_ORDERABLE
    owner: mechanical
    finding: The off-board capsule landing avoids inventing terminal pitch, but capsule mounting, wire dress, strain relief, acoustic port, windscreen, drainage and connector registration remain unqualified.
    closes_when: The exact capsule, cable and enclosure assembly are physically reviewed and the assembly process retains fit, polarity, strain-relief and acoustic-path evidence.

  - id: POD-F5-cable-and-audio-performance
    state: open
    blocks_at_or_above: FIRST_ARTICLE_TESTED
    owner: lab
    finding: Gain, phase, common mode, self-noise, clipping, stability, polarity, CMRR and crosstalk have not been measured through exact 4 m and 15 m harnesses into the carrier receiver.
    closes_when: The serialized pod and carrier fixtures pass the signed cable/audio acceptance matrix with retained raw waveforms and audio data.

  - id: POD-F6-no-hardware-evidence
    state: open
    blocks_at_or_above: FIRST_ARTICLE_TESTED
    owner: lab
    finding: No fabricated pod has supplied measured first-power, rail-noise, protection, thermal, acoustic or ESD/EMC evidence.
    closes_when: A serialized first article completes 01_docs/FIRST_ARTICLE_TEST_PLAN.md and the structured authorization record plus hash-bound raw evidence are retained.

  - id: POD-F7-roof-environment
    state: open
    blocks_at_or_above: PRODUCTION_RELEASED
    owner: systems
    finding: The PCB source does not establish weatherproofing, condensation control, lightning or building-entry safety, or unattended roof reliability.
    closes_when: The complete pod enclosure and installed harness pass the approved wind, rain, condensation, thermal, EMC and building-entry safety qualification.
