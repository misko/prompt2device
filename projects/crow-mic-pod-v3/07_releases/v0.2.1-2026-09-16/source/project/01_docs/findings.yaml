    closes_when: Independently reconcile actual manufacturer/native body features and footprint datums with the measured envelopes, correct only the proven owning source through independent acceptance if needed, and pass normal model registration with unchanged engineering floors before orientation and placement review. No prior carrier PASS is inherited as pod physical proof.
