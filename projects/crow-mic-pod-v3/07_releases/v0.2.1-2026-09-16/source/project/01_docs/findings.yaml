schema: 1
target: DRAFT

gates:
  - id: POD-commission-and-architecture
    required_for: DESIGN_CLEAN
    state: pending
    owner: systems
    closes_when: The user boundary, shared spoke interface, pod architecture and accepted engineering decisions are explicit and traceable.
    evidence:
      - 01_docs/BRIEF.md
      - 01_docs/ARCHITECTURE.md
      - 01_docs/decisions/0001-four-wire-analog-spoke.md
      - 01_docs/decisions/0002-protected-quiet-five-volt-rail.md
      - 01_docs/decisions/0003-active-balanced-audio.md
      - 01_docs/decisions/0004-bare-ic-exceptions.md
      - 01_docs/decisions/0005-first-article-only-release.md

  - id: POD-exact-parts-and-prelayout
    required_for: DESIGN_CLEAN
    state: pending
    owner: electrical
    closes_when: Exact part/source policy passes in full and the governed exact-code public-catalog screen admits design progression; authenticated JLCPCB allocation remains a separate order-readiness gate.
    evidence:
      - 01_docs/decisions/0006-public-catalog-prelayout-only.md
      - 06_build/policy_audit.md
      - 06_build/sourcing/public_catalog_stock.json

  - id: POD-schematic
    required_for: DESIGN_CLEAN
    state: pending
    owner: electrical
    closes_when: The exact generated schematic and netlist pass machine gates plus independent topology and rendered-schematic reviews.
    evidence:
      - 06_build/checkpoints/schematic.json
      - 08_reviews/pre-route_topology.md
      - 08_reviews/pre-route_schematic_render.md

  - id: POD-placement-and-routing
    required_for: DESIGN_CLEAN
    state: pending
    owner: layout
    closes_when: The governed placement and routed PCB pass exact geometry, connectivity, analog-return, realized-path, DRC, render and fresh-context review gates under the public-catalog design-progression policy.
    evidence:
      - 04_kicad/crow_mic_pod_v3.kicad_pcb
      - 06_build/verification/realized_route_receipt.json
      - 06_build/verification/route_acceptance_receipt.json
      - 08_reviews/pre-route_pin.md
      - 08_reviews/pre-route_layout.md
      - 08_reviews/pre-route_render.md

  - id: POD-release-package
    required_for: FIRST_ARTICLE_ORDERABLE
    state: pending
    owner: fabrication
    closes_when: A fresh reviewed BOM, CPL and fabrication package passes final JLC allocation, population, sourcing, release-rehearsal and immutable-seal gates with every order hold closed.

  - id: POD-first-article-test
    required_for: FIRST_ARTICLE_TESTED
    state: pending
    owner: lab
    closes_when: Fabricated pods pass the controlled first-article test plan with retained raw power, analog, cable, acoustic, thermal and assembly evidence.

  - id: POD-production-validation
    required_for: PRODUCTION_RELEASED
    state: pending
    owner: manufacturing
    closes_when: A controlled pilot lot and the complete roof enclosure, harness, environmental and production test processes are approved.

