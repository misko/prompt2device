  ADC_CLOCK:
    intent: "MCHStreamer-master 24.576 MHz MCLK, 12.288 MHz BCLK, 48 kHz FSYNC and TDM return"
    nets: [MCH_MCLK, MCH_BCLK, MCH_FSYNC, MCLK_BUF, BCLK_BUF, FSYNC_BUF, ADC_MCLK, ADC_BCLK, ADC_FSYNC, TDM_RAW, TDM_CLEAN, TDM_BUFFERED, ADC_TDM]
    current: "signal only; 3.3 V CMOS logic"
    min_width: 0.36mm
    clearance: 0.25mm
    routing: "F.Cu/B.Cu over the adjacent continuous In1.Cu/In2.Cu GND planes; only ordinary through vias may change outer layers. The public JLC04161H-7628 prototype stack and nominal0.36 mm bulk remain an unsolved Cirrus50 ohm hypothesis. ADR0011 keeps every subnominal launch in an exact small named F.Cu rule area; ordinary-width terminal continuations clear the package rows before generic routing. FSYNC_BUF and BCLK_BUF are deterministic complete seeds; other digital nets retain one wave owner. Field solve and realized return/width/extent remain BLOCKED. Preserve source resistors and all three MCH pull-down branches; no invented termination on TDM_RAW."
    verify: "post-route prove every segment uses F.Cu/B.Cu with its declared adjacent GND plane, every layer transition is an ordinary through via across the same two continuous GND planes, and the final stitch result keeps both planes on one GND component; then scope at source and ADC, logic-analyzer edge/slot/sign/order qualification, and all independent-power-state current/logic tests"

  GROUND:
    intent: "continuous analog/digital return with local Cirrus layout discipline"
    nets: [GND]
    current: "return for power and signals; aggregate current follows the source and branch budgets"
    min_width: 0.30mm
    clearance: 0.18mm
    pour_fed: "common GND reference planes on In1.Cu and In2.Cu plus top/bottom pours; never split either inner plane beneath audio or clocks"
    routing: "direct exposed-pad and decoupling vias; buck high-di/dt return isolated by placement"
    verify: "plane continuity, return-path review and DRC"

