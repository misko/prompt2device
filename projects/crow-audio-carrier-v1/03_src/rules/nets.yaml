# Existing output-board projection consumer; NOT filled-plane continuity,
# per-net reach coverage, pad/hole/antipad clearance or an impedance solver.
# All13 governed digital nets are source-owned F.Cu/zero-via paths. The
# realized digital path/census gates enforce that restriction independently;
# a B.Cu projection declaration with zero governed tracks would be vacuous.
reference_plane_checks:
  ADC_DIGITAL_RETURN:
    signal_layer: F.Cu
    reference_layer: In1.Cu
    reference_net: GND
    signal_nets: [MCH_MCLK, MCH_BCLK, MCH_FSYNC, MCLK_BUF, BCLK_BUF, FSYNC_BUF, ADC_MCLK, ADC_BCLK, ADC_FSYNC, TDM_RAW, TDM_CLEAN, TDM_BUFFERED, ADC_TDM]
    min_track_clearance_mm: 0.25
    min_via_clearance_mm: 0.50

# Existing realized-copper consumer: report ordered endpoint paths and reject
# layer transitions on these single-layer digital sections. Do not invent an equal-length/skew
# requirement for dissimilar clocks; device/package delays and unmeasured
# pad-entry copper do not cancel.
length_match:
  MCH_INPUT_SECTIONS:
    adr: 0010-route-stack-and-current-paths
    intent: "Report biased digital paths: each MCH clock input and the complete ADC-to-MCH TDM return, each with its real pull-down leaf. No equal-length claim; all branches and active-stage delays remain distinct."
    members:
      MCLK: [MCH_MCLK]
      BCLK: [MCH_BCLK]
      FSYNC: [MCH_FSYNC]
      TDM: [TDM_RAW, TDM_CLEAN, TDM_BUFFERED, ADC_TDM]
    topology: tree
    congruent_pads: false
    no_vias: true
    max_spread_mm: report
    stackup_mm: [0.2104, 1.065, 0.2104]
    octilinear_endpoints:
      MCLK: [J10.9, U_CLK.1]
      BCLK: [J10.10, U_CLK.3]
      FSYNC: [J10.12, U_CLK.6]
      TDM: [U_ADC.25, J10.2]
    paths:
      MCLK:
        - {id: main, segments: [{net: MCH_MCLK, from: J10.9, to: U_CLK.1}]}
        - {id: pull_down, segments: [{net: MCH_MCLK, from: U_CLK.1, to: R_MCH_MCLK_PD.1}]}
      BCLK:
        - {id: main, segments: [{net: MCH_BCLK, from: J10.10, to: U_CLK.3}]}
        - {id: pull_down, segments: [{net: MCH_BCLK, from: U_CLK.3, to: R_MCH_BCLK_PD.1}]}
      FSYNC:
        - {id: main, segments: [{net: MCH_FSYNC, from: J10.12, to: U_CLK.6}]}
        - {id: pull_down, segments: [{net: MCH_FSYNC, from: U_CLK.6, to: R_MCH_FSYNC_PD.1}]}
      TDM:
        - id: main
          segments:
            - {net: TDM_RAW, from: U_ADC.25, to: U_TDM_SCH.2}
            - {net: TDM_CLEAN, from: U_TDM_SCH.4, to: U_TDM.2}
            - {net: TDM_BUFFERED, from: U_TDM.4, to: R_TDM.1}
            - {net: ADC_TDM, from: R_TDM.2, to: J10.2}
        - id: pull_down
          segments:
            - {net: TDM_RAW, from: U_TDM_SCH.2, to: R_TDM_PD.1}
  BUFFERED_DIGITAL_SECTIONS:
    adr: 0010-route-stack-and-current-paths
    intent: "Report unbranched buffered clock sections; biased TDM is grouped above with the other real pull-down trees. No equal-length claim or active-delay cancellation."
    members:
      MCLK: [MCLK_BUF, ADC_MCLK]
      BCLK: [BCLK_BUF, ADC_BCLK]
      FSYNC: [FSYNC_BUF, ADC_FSYNC]
    topology: chain
    congruent_pads: false
    no_vias: true
    max_spread_mm: report
    stackup_mm: [0.2104, 1.065, 0.2104]
    octilinear_endpoints:
      MCLK: [U_CLK.7, U_ADC.34]
      BCLK: [U_CLK.5, U_ADC.29]
      FSYNC: [U_CLK.2, U_ADC.24]
    paths:
      MCLK:
        - id: main
          segments:
            - {net: MCLK_BUF, from: U_CLK.7, to: R_MCLK.1}
            - {net: ADC_MCLK, from: R_MCLK.2, to: U_ADC.34}
      BCLK:
        - id: main
          segments:
            - {net: BCLK_BUF, from: U_CLK.5, to: R_BCLK.1}
            - {net: ADC_BCLK, from: R_BCLK.2, to: U_ADC.29}
      FSYNC:
        - id: main
          segments:
            - {net: FSYNC_BUF, from: U_CLK.2, to: R_FSYNC.1}
            - {net: ADC_FSYNC, from: R_FSYNC.2, to: U_ADC.24}
  # ADR0019: matched P/N copper paths, including every branch after the buffers.
  # 1 mm per section is our engineering tolerance, not a Cirrus numeric limit.
  ANALOG_CH1_OUTPUT:
    adr: 0019-analog-path-matching
    intent: "Match channel 1 output P/N endpoint paths within 1 mm, with every real shunt/feedback leaf accounted. Not a controlled-impedance or component-delay claim."
    members: {P: [OPA_P1], N: [OPA_N1]}
    topology: tree
    congruent_pads: false
    no_vias: false
    max_spread_mm: 1.0
    router_moves: octilinear
    elongation: meander
    stackup_mm: [0.2104, 1.065, 0.2104]
    octilinear_endpoints:
      P: [U_AFE1.1, R_OUT1P.1]
      N: [U_AFE1.7, R_OUT1N.1]
    paths:
      P:
        - {id: main, segments: [{net: OPA_P1, from: U_AFE1.1, to: R_OUT1P.1}]}
        - {id: feedback, segments: [{net: OPA_P1, from: U_AFE1.1, to: C_FB1P.2}]}
      N:
