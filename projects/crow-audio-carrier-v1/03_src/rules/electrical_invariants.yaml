      n_start: 1
      pins: {"1": 12V_PROTECTED, "2": "12V_POD{n}"}
    - refs: [U_ESD1, U_ESD2, U_ESD3, U_ESD4, U_ESD5, U_ESD6, U_ESD7, U_ESD8]
      n_start: 1
      pins: {"3": "AUDIO_P{n}", "4": GND, "5": "AUDIO_N{n}"}
      unconnected: ["1", "2"]
    - refs: [U_RST1]
      pins: {"1": GND, "2": POR_N, "3": 3V3_ADC}
    - refs: [U_RST2]
      pins: {"1": GND, "2": 3V3_ADC, "3": POR_N, "4": GND, "5": RESET_PULSE_H, "6": RESET_C, "7": RESET_RC, "8": 3V3_ADC}
