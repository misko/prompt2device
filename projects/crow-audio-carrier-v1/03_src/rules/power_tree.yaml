rails:
  # ADR0025: eight OPA2320 and ADC share3V3; local5V steady allocation remains0.30A.
  # Old split-rail transient assumptions are retired, not inherited.
  - {name: 5V_BUCK, vin_min: 9.86, vin_max: 13.2, vout_min: 4.85, vout_max: 5.15, iout_max_A: 0.30, converter: AP63205WU-7, external_output: false, eff: 0.85, note: "ADR0022 D_BUCK_IN US1B-13-F isolates VIN/EN and all three ceramics;1.3V engineering drop, not an all-temperature VF guarantee. Input bank remains13.77uF minimum."}
  # Thermally adequate replacement; full power-state screen/steady-budget OPEN rows in ADR0009.
  - {name: 3V3_ADC, vin_min: 4.10, vin_max: 5.15, vout_min: 3.23, vout_max: 3.35, iout_max_A: 0.23, converter: LT3041ADE#TRPBF, input_parent: 5V_BUCK, dropout_mv: 500, pdiss_max_mw: 702, external_output: false, eff: 0.65, note: "ADR0025 shared rail. Input remains5V_LDO_HOLD behind D_HOLD/R_PRE/Q_PRE. Reverse protected LT3041; up15mA reverse overshoot sink and25mA powered ground budget are not zero. source-only architecture checker owns current arithmetic; physical source and prototype qualification remain open."}

  - &spoke
    name: 12V_POD1
    stage: distribution
    vin_min: 11.16
    vin_max: 13.2
    vout_min: 11.16
    vout_max: 13.2
    iout_max_A: 0.10
    external_output: true
    claim_id: eight_analog_spokes
    load_uv_threshold: 10.8
    ir_budget_mohm: 2200
    ir_budget_components_mohm:
      protection_switch: {value: 1700, basis: maximum, evidence: "Littelfuse 1812L035/60MR published 1.700 ohm post-trip/reflow maximum; hot realized four-wire qualification owed"}
      pcb_copper_vias_joints: {value: 400, basis: budgeted_max, evidence: "per-spoke path from 12V_PROTECTED through F1-F8 to J1-J8; common trunk copper is charged separately by upstream_delivery"}
      connector_contacts: {value: 100, basis: budgeted_max, evidence: "RJ45 mated cord excluded; board-side paralleled power-contact allocation only"}
    margin: 0.2
    margin_basis: worst_case_delivery
    margin_evidence: "The upstream 200 milliohm common path is charged at the rounded 1.0 A trunk current, then the 2.2 ohm branch/copper/header path is charged at 0.10 A; applying 20 percent to both leaves a calculated 10.896 V carrier-header floor, 96 mV above 10.8 V. Hot four-wire proof is still owed."
    distribution: {series_devices: [1812L035/60MR], path_resistance_max_mohm: 2200, current_limit_min_A: 0.10, current_limit_max_A: 0.70, reverse_current_policy: "Upstream Q_IN blocks reversed J9 hookup only; no downstream reverse source is permitted, pods contain no source, and hot plug is forbidden"}
  - <<: *spoke
    name: 12V_POD2
  - <<: *spoke
    name: 12V_POD3
  - <<: *spoke
    name: 12V_POD4
  - <<: *spoke
    name: 12V_POD5
  - <<: *spoke
    name: 12V_POD6
  - <<: *spoke
    name: 12V_POD7
  - <<: *spoke
    name: 12V_POD8
