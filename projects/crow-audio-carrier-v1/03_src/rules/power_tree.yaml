schema: 1
source_type: isolated_external_12V_supply
source_voltage_boundary:
  minimum_operating_V: 11.4
  evidence: >-
    First-article input boundary is a regulated isolated 12 V source at
    11.4-13.2 V. The board does not create the safety isolation barrier.
off_control: disconnect_J9_isolated_12V_input
quiescent_ua: 1000
input_trunk_class: POD_POWER
ir_floor_mohm: 100
upstream_delivery:
  source_net: 12V_IN
  destination_net: 12V_PROTECTED
  source_min_V: 11.4
  destination_floor_V: 11.16
  load_current_A: 1.0
  margin: 0.20
  evidence: >-
    The rounded 1.0 A trunk bound exceeds the executable 0.986 A conditional worst-case
    load. Published post-trip/reflow maxima are used for F_IN; Q_IN uses its
    room-temperature maximum, while hot four-wire common-path proof remains a
    first-article hold. ADR0022 adds a local-only1.3V diode drop budget;
    5V_BUCK vin_min is9.86V while the unchanged spoke floor remains11.16V.
  rails: [5V_BUCK, 12V_POD1, 12V_POD2, 12V_POD3, 12V_POD4, 12V_POD5, 12V_POD6, 12V_POD7, 12V_POD8]
  fixed_drop_components_mV:
    no_fixed_semiconductor_drop: {value: 0, basis: topology, evidence: "The selected reverse-hookup element is a low-side-driven PFET, not a series diode; only resistance is charged."}
  resistance_components_mohm:
    input_pptc: {value: 75, basis: manufacturer_R1max, evidence: "Littelfuse 2920L260/33 published 0.075 ohm post-trip/reflow maximum."}
    reverse_hookup_pfet: {value: 25, basis: manufacturer_maximum, evidence: "DMP6023LFG-13 published 25 milliohm maximum at the governed gate-drive condition."}
    common_trunk_copper_vias_joints: {value: 100, basis: budgeted_max, evidence: "Conservative common-path allocation from J9 through F_IN and Q_IN to 12V_PROTECTED; hot four-wire realization is owed."}

effective_capacitance_banks:
  - name: AP63205 input capacitor
    requirement_uF: 10
    requirement_evidence: "Diodes AP63205 DS41326 Rev 3-2 Figure 1"
    accepted_dielectrics: [ceramic]
    contributors:
      - {part: 12105C106K4Z2A, refs: [C_BUCK_IN, C_BUCK_IN2, C_BUCK_IN3], nominal_each_uF: 10, dielectric: ceramic, tolerance_minus_pct: 10, dc_bias_derating_pct: 40, temperature_derating_pct: 15, lifecycle_derating_pct: 0, basis: conservative_engineering_bound, evidence: "three exact 50 V X7R capacitors leave 13.77 uF under the declared tolerance/bias/temperature deratings; exact lot curve and board placement remain first-article holds"}
  - name: AP63205 output capacitor
    requirement_uF: 44
    requirement_evidence: "Diodes AP63205 DS41326 Rev 3-2 Figure 1 uses 2x22uF"
    accepted_dielectrics: [ceramic]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_BUCK_O1, C_BUCK_O2, C_BUCK_O3], nominal_each_uF: 47, dielectric: ceramic, tolerance_minus_pct: 10, dc_bias_derating_pct: 40, temperature_derating_pct: 15, lifecycle_derating_pct: 0, basis: conservative_engineering_bound, evidence: "three exact in-production 10 V X7R capacitors leave 64.72 uF under the declared tolerance/bias/temperature deratings; exact lot curve and placement remain first-article/source holds"}
  - name: LT3041 input capacitor
    requirement_uF: 10
    requirement_evidence: "ADI LT3041 Rev.A input10uF local ceramic recommendation; selected47uF requires layout review"
    accepted_dielectrics: [ceramic]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_IN], nominal_each_uF: 47, dielectric: ceramic, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 0, basis: conservative_engineering_bound, evidence: "Exact selected 47 uF 10 V X7R part; declared 10% tolerance, 50% bias and 15% temperature losses leave 17.9775 uF here. The separate power-state model additionally charges 10% lifecycle loss. Installed effective capacitance and loop stability remain unmeasured prototype obligations."}
  - name: LT3041 dual output capacitor
    requirement_uF: 20
    requirement_evidence: "ADI LT3041 Rev.A requires two10uF effective ceramic capacitors, each ESR below20mohm and ESL below2nH. Each selected47uF gives16.17975uF with lifecycle allowance; proximity/Kelvin stability evidence remains OPEN."
    accepted_dielectrics: [ceramic]
    contributors:
      - {part: GRM32ER71A476KE15L, refs: [C_LDO_OUT, C_OPA_BULK], nominal_each_uF: 47, dielectric: ceramic, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 0, basis: conservative_engineering_bound, evidence: "Exact selected 47 uF 10 V X7R part; declared 10% tolerance, 50% bias and 15% temperature losses leave 17.9775 uF here. The separate power-state model additionally charges 10% lifecycle loss. Installed effective capacitance and loop stability remain unmeasured prototype obligations."}
  - name: CS5308P LDO_A_FILT
    requirement_uF: 0.8
    requirement_evidence: "Cirrus CS530x Schematic and Layout Guidelines, July 2025, section 1.6; official inner PDF SHA-256 a97e3cfbe311caf603bd56b7aeab189dd38727104168c26bb67dd24add07b62f"
    accepted_dielectrics: [x7r]
    contributors:
      - {part: GRM188Z71C475KE21D, refs: [C_LDO_A], nominal_each_uF: 4.7, dielectric: x7r, tolerance_minus_pct: 10, dc_bias_derating_pct: 50, temperature_derating_pct: 15, lifecycle_derating_pct: 10, basis: conservative_all_corner_screen, evidence: "exact C389010/MPN identity; common 0.34425 factor leaves 1.618 uF and startup/stability remains a first-article hold"}
  - name: CS5308P LDO_D_FILT
    requirement_uF: 0.8
    requirement_evidence: "Cirrus CS530x Schematic and Layout Guidelines, July 2025, section 1.7; official inner PDF SHA-256 a97e3cfbe311caf603bd56b7aeab189dd38727104168c26bb67dd24add07b62f"
