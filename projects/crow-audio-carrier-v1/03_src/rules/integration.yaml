  rationale: One converter preserves one clock and one TDM frame for all eight channels and is the only selected
    architecture that directly implements the MCHStreamer TDM8 input without firmware or inter-ADC synchronization.
    The252-ref ADC/front-end boundary includes all channel coupling/filter/isolation, reference/mode and clock/reset/interface
    supports. It is not a minimal or module-replaceable count. Another80 fitted refs outside this boundary (9buck
    supports, U_BUCK,70shared power/spoke infrastructure) remain explicit dependencies in ADR0001; U_ADC itself
    is excluded.
  exception:
    decision_rationale: A complete eight-channel USB module would duplicate or replace the already selected external
      MCHStreamer and would not expose the required eight long-cable balanced analog inputs. The bare CS5308P is
      therefore the lower-complexity boundary for this carrier, provided the complete Cirrus buffer/filter and reset
      sequence are implemented.
    evidence: One ADC clock/TDM domain without firmware. The complete252-ref ADC/front-end boundary is enumerated;
      all80 external shared/infrastructure dependencies are separately named in ADR0001. Both boundaries exceed
      threshold10 for the ADC, and the existing primary-backed module comparison remains applicable.
    modules_considered:
    - part: miniDSP MCHStreamer
      rejected_because: It is retained as the cable-connected USB/TDM transport but has no eight-channel analog
        ADC front end and cannot replace the CS5308P.
      evidence: miniDSP MCHStreamer User Manual, TDM8 input pinout
    - part: Cirrus Logic DC5308P evaluation platform
      rejected_because: It is a laboratory evaluation assembly, not a roof-carrier module; it does not provide the
        eight protected RJ45 analog/DC spoke interfaces.
      evidence: Cirrus DC5302P/DC5308P evaluation schematic and layout archive
    adr: 01_docs/decisions/0001-single-cs5308p-tdm8.md
