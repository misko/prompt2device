  rationale: Complete converter inventory is nine external parts, below threshold10. Retain the fixed5V AP63205
    with integrated switches, compensation and feedback; this avoids another module connector, height and separate
    mounting boundary on the154x100mm carrier. Input protection is shared with eight spoke branches; downstream
    hold/precharge/LT3041 circuitry remains necessary for either implementation. The isolated12V COTS source is
    retained upstream; no module market survey or qualified thermal/EMI performance is claimed. ADR0003 states every
    boundary membership and the complexity-weighted source decision. Manufacturer AP63205 DS41326 Rev3-2 pin functions/application
    circuit and ARCHITECTURE own the facts.
