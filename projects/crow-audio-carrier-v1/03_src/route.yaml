project:
  name: crow_audio_carrier_v1
  board: 04_kicad/crow_audio_carrier_v1.kicad_pcb
  build_dir: 06_build/route
flow:
  heartbeat_s: 10
  rebuild_args:
  - --resume-after-blocked-sourcing
  pre_route_reviews:
    board: 04_kicad/crow_audio_carrier_v1.kicad_pcb
    netlist: 06_build/netlists/crow_audio_carrier_v1.net
    topology: 08_reviews/pre-route_topology.md
    schematic_pdf: 03_tscircuit/build/schematic.pdf
    schematic_render: 08_reviews/pre-route_schematic_render.md
    pin: 08_reviews/pre-route_pin.md
    layout: 08_reviews/pre-route_layout.md
    render: 08_reviews/pre-route_render.md
    a_render: 06_build/pre_route/twin_overlay.md
  owner:
    stage: routing
    files:
    - 03_src/route.yaml
    - 03_src/floorplan.yaml
  copper:
    deterministic:
    - prep.seed_stubs
    - taps.connections
    - stitch.seed_stubs
    stochastic:
    - route.waves
  budgets_s:
    tscircuit_deps: 30
    tscircuit_build: 120
    escape_packages: 60
    escape_lands: 180
    tier_preflight: 30
    grind: 1800
    rebuild: 2400
    layout_drc: 240
  timeouts_s:
    default: 600
    source_schema_governance: 60
    adr_bound_governance: 60
    tscircuit_deps: 120
    tscircuit_build: 240
    route_wave: 1800
    route_race: 3600
    route_evaluate: 240
    route_import: 300
    stitch: 1200
    rebuild: 3000
    layout_drc: 240
  blockers:
  - The routed candidate remains FIRST-ARTICLE-ONLY / DO-NOT-ORDER until the exact filled-board gates, fresh review
    launches, release sealing, and loaded electrical/thermal validation at the documented first-article boundary
    complete.
  - The 2.5 A transient case is a design bound rather than a continuous via rating. A-VIA grades the 0.30 A steady
    allocation; scoped startup/current-limit, reverse-current, discharge and temperature captures remain mandatory
    first-article evidence.
  - ADR-0007 admits prototype release after connector source, geometry, review and release gates; FULL physical
    qualification remains owed for FIRST_ARTICLE_TESTED.
