        why: Complete U_ADC.32/.33/C_LDO_D.1 source tree uses 0.35mm F/B copper with explicit plated transfers.
          Excluded from generic routing; no separate VDD_D rail is introduced. Reopened-board connectivity and width
          remain mandatory.
