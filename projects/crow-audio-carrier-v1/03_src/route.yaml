          owed.
      12V_PROTECTED:
        topology: wide_trunk
        owner: route.wave
        allow_generic_router: true
        why: 'Prototype candidate only: a dedicated 1.2 mm pod_power-wave override carries the <=1.0 A trunk, with
          0.6 mm branch floors. At 70 C and 35 um copper, 150 mm of 1.2 mm trace is approximately 74 mOhm, below
          the 100 mOhm common-copper allocation before vias/joints. Final exact-tree current/drop and thermal review
          must pass; the generic router does not prove star topology or the IR budget.'
