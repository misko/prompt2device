classes:
  POD_POWER:
    intent: "protected 12 V trunk and eight 100 mA continuous spoke branches"
    nets: [12V_IN, 12V_FUSED, 12V_PROTECTED, 12V_BUCK_IN, 12V_POD1, 12V_POD2, 12V_POD3, 12V_POD4, 12V_POD5, 12V_POD6, 12V_POD7, 12V_POD8]
    current: "1.0 A trunk design bound (0.986 A conditional worst case including ADR0022 input diode); each branch 0.10 A"
    min_width: 0.60mm
    clearance: 0.25mm
    routing: "short wide top/bottom trunk, individual PTC branch, no audio-pair crossings"
    verify: "four-wire branch drop at 0.10 A each and all-eight loaded thermal test"

  POWER_TRANSIENT:
    # OPEN ADR0021: retained2.5A/1.20mm legacy planning case below is NOT a
    # maximum-current guarantee. AP63205 HS max3.1A/LS valley max3.9A do not
    # bound reservoir equalization. The proposed4A feed budget has no qualified
    # waveform/duration;1.20mm entries do not prove4A ampacity. Do not generate
    # until current-duration/thermal authority closes; no exception widening.
    intent: "Local buck/hold/LDO charging and discharge pulse paths; not a raised steady allocation"
    nets: [5V_BUCK, 5V_LDO_FEED, 5V_LDO_HOLD, 3V3_ADC, FILT1P, FILT2P, ADC_DUMP, BUCK_SW]
    current: "2.5 A transient design bound; 0.30 A steady allocation; dated coordinator amendment ADR0009"
    min_width: 1.20mm
    clearance: 0.20mm
    routing: "wide F.Cu bulk paths; 1.20 mm exceeds the existing 1 oz/10 C 2.5 A helper floor of 1.06304 mm. Fine-pitch taps and current-transfer/return geometry remain BLOCKED under ADR0010; no blanket neck-down or pour-fed exemption. Do not route yet."
    verify: "scoped startup/current-limit, reverse-current and discharge captures per ADR0009"
  POWER_CONTROL:
    intent: "Analog-isolation, supervisor, precharge and delayed-dump interlocks"
    nets: [OPA_BLEED_A, AUDIO_EN, PWR_EN, LDO_EN, LDO_NR, PRE_GATE, PWR_SENSE, ADC_SENSE, PWR_CT, AUDIO_CT, DUMP_RC, DUMP_GATE, ADC_RESET_N, CFG1, CFG2, CFG4, CFG5, POR_N, Q_IN_GATE, RESET_C, RESET_PULSE_H, RESET_RC, MCH_3V3_SENSE, TDM_SENSE_G, TDM_OE_N]
    current: "signal"
    min_width: 0.20mm
    clearance: 0.25mm
    routing: "local quiet signals, separated from buck switching"
    verify: "native exact-pin interlock audit and scoped cold-start/brownout captures"
  BOOTSTRAP:
    intent: "High-dv/dt buck bootstrap capacitor loop, not a quiet control or load-distribution rail"
    nets: [BUCK_BST]
    current: "signal: local switched bootstrap gate-charge loop; no added steady load allocation"
    min_width: 0.20mm
    clearance: 0.25mm
    routing: "short F.Cu U_BUCK.6 to C_BUCK_BST.1; close the loop through C_BUCK_BST.2/BUCK_SW/U_BUCK.5; separate from analog and quiet control"
    verify: "exact local loop and switch-node coupling review, scope with a suitable differential probe"
  QUIET_POWER:
    intent: "ADC internal reference outputs, passive external bias dividers and internal ADC LDO filter pins; not the shared3V3_ADC bulk rail"
    nets: [VMID1, VMID2, VMID1_EXT, VMID2_EXT, LDO_A_FILT, LDO_D_FILT]
    current: "0.30 A steady local allocation; 3V3 charge pulse is separately governed"
    min_width: 0.35mm
    clearance: 0.20mm
    routing: "star from converter/filter; local decoupling; keep buck switch loop in southwest corner"
    verify: "startup, loaded DC, ripple and idle-spectrum tests"

