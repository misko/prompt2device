    min_width: 0.36mm
    clearance: 0.25mm
    routing: "F.Cu over continuous In1.Cu GND; public JLC04161H-7628 prototype stack, nominal0.36 mm bulk is an unsolved Cirrus50 ohm hypothesis. ADR0011 adds only six bounded0.18 mm launch banks and two full-width corner launches, with exact small named rules; FSYNC_BUF is deterministic, other digital nets retain one wave owner. Field solve and realized return/width/extent remain BLOCKED. Preserve source resistors and all three MCH pull-down branches; no invented termination on TDM_RAW."
