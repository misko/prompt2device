gotchas:
  - 'OUT-to-IN reverse protection is explicit even when IN is grounded/intermediate/open. It does not mean zero OUT discharge: SET resistor and up to15mA overshoot recovery remain.'
  - 'Tie PGFB to IN to disable fast startup, ILIM to GND, float VIOC and PG. Existing upstream reverse-hookup protection remains; PGFB direct IN does not claim regulator reverse-battery application.'
  - 'Two separate local output ceramics are mandatory; each must retain>=10uF and satisfy ESR<20mohm/ESL<2nH. Copper and installed stability remain prototype obligations.'
  - 'The 2nF SET choice trades low-frequency supply-noise filtering for short startup. No datasheet1uVrms noise claim is inherited.'
  - 'Exposed pad15 and GND10/11 must be soldered/common. Kelvin OUTS12 at local output capacitors; SET capacitor/resistor return at their quiet ground. Old TPS7A92 copper is invalid.'
layout:
  source: LT3041 Rev.A pp7-8,22-23,26,29-30,36; UG-2059 Rev0 pp5-6; package05-08-1708
  reviewed: '2026-09-09 source layout ownership, not native acceptance'
  notes:
    - 'ADR0025 keeps two separate47uF output ceramics near physical OUT13/14. OUTS12 must sense the output-capacitor terminals through a low-current Kelvin path, not the upstream power neck.'
    - 'CSET and RSET ground must Kelvin-connect to the output-capacitor ground. Input and output power return geometry must not inject switching or load-drop error into this reference.'
    - 'UG-2059 pp5-6 uses overlapping input/return conductors and split capacitor connections. Extract those decisions, not the evaluation-board copper. Native implementation and ESR/ESL qualification are still owed.'
    - 'The2nF SET choice is below the datasheet10nF example for suppressing coupled SET interference; startup tradeoff is explicit in ADR0025. No evaluation-board noise or PSRR rating is inherited.'
    - 'EP15 is5.61mm2: two source-owned0.60/0.30mm filled/capped thermal vias now lie inside the actual pad; GND7/10/11 have explicit short bonds to EP15. Source-native clearance and containment pass. Continuous filled heat spreading and achieved thermal resistance remain unqualified.'
    - 'ADR0025 local source now separates OUTS12 and SET-ground branches until C_LDO_OUT terminals. Native contact-graph cuts and pour/via reservations are checked, but fresh generation, filled return topology, independent review and installed behavior remain owed.'
    - 'C_HOLD1/2 are low-frequency reservoirs, not local input bypasses. New20/30mm copper-gap allocations accommodate the larger filter cells; the old TPS16/17.5mm allocations no longer describe this layout. Feeder impedance and transient behavior remain routed/first-article obligations.'
