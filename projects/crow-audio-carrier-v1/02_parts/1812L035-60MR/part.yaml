gotchas:
- Pad 1 is local left and pad 2 local right; electrically nonpolar. Exact published family lands replace stock 1812 copper.
  Maximum-body F.Fab is 4.73x3.41mm; courtyard encloses body and copper with >=0.25mm clearance. Geometry is not thermal trip
  or assembly-process qualification. Independent source review df2f98a2383b8f2729b092668414dc3138f6165573b85c070eb57a9212d85afe.tar.gz
  is retained in 01_docs/journal; fresh generated pin/layout review remains owed.
- This is a thermally operated resettable protector, not a precision current limiter. Trip time, ambient, copper heat sinking,
  prior trip history, and airflow all matter.
- Use the published 1.700Ohm R1max for the normal-path voltage budget; do not substitute initial or typical resistance.
- The carrier part protects the spoke cable and pre-pod path. The pod's 0ZCJ0010FF2E is the lower-current downstream-board
  tier. Both tiers still require fault tests.
