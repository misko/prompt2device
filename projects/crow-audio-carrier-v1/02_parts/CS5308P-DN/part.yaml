gotchas:
  - "DS1314F1 section 4.5.6/p31 and Figure 2-2/p8 require external VMID in hardware/default mid-impedance mode. ADC_VMID1/2 retain local bypass only, not a connection to the external input-buffer bias circuit."
  - "Figure 2-2 connects ADC_FILT1N/2N and the three capacitors per reference bank directly to GND; the one-ohm elements belong only in positive feeds."
  - "Pad 49 is electrical ground authority, not a mechanical-only pad; it must be present in the netlist and tied to the low-impedance ground plane."
  - "The 0.4mm-pitch QFN and analog input/filter perimeter require an advanced four-layer escape and an independent exact-footprint pin review."
  - "Public E0 reference PCB/PADS/IPC study2026-09-08: stagger configuration drops outward before placing wide power elbows; route VMID around, not across, their exits. Re-derive against our0.50/0.20mm vias,0.15mm annulus and exact neighboring capacitors. The EVM's0.40/0.20mm via,4.8mm copper EP land and8-layer stack are not our footprint/process authority."
  - "CONFIG/HGC and SPI/I2C multiplexing is strap/configuration dependent; firmware and population rules must agree before power-up."
  - "Table 3-9 specifies ADC_VMIDn as 1.65V nominal only, with no minimum or maximum; an op-amp common-mode proof cannot silently treat the nominal as a production bound."
verified: "CITED: Cirrus Logic DS1314F1 Figure 1-1 and Table 1-1, PDF pp.4-5, independently fix pins 1-48 and exposed paddle 49; re-read 2026-09-01."
layout:
  source: Cirrus DS1314F1 Figure 2-1 typical connection, PDF pp.7-8, and Section 5 input buffer, PDF p.47; Cirrus AN0556R1 Section 1.2/Figure
    2, PDF p.4, locally hash-bound in notes.md
  reviewed: '2026-09-08'
  notes:
  - Keep each differential microphone pair short, symmetric, and separated from clocks and the buck switch node.
  - Place every analog, digital, VMID, LDO-filter, and ADC-filter capacitor at its owning pin group with a direct ground return.
  - Use a continuous ground plane under the ADC and exposed paddle; do not split analog and digital return planes beneath the package.
  - 'Carrier local-placement source 2026-09-08: exact-ref/non-ground-net adjacency is a rotation-aware copper-bounding-box gap, NOT pad-center
    distance or routed length. Rounded engineering ceilings below are not manufacturer numerical maxima. Ground pours are excluded by P-ADJ-PAIR;
    local return/thermal/escape proof remains owed on the later saved PCB.'
  - Source-only pin-center plan uses <=5mm local bypass/BST and <=10mm feedback ceilings, with separately named bulk/input/feed exceptions. See
    01_docs/SOURCE-CORRECTION-20260908-local-placement.md for all 299 roles and exact source geometry; no current-board acceptance is inherited.
  - Each ADC supply/VMID/LDO/FILT ceramic is separately constrained to its physical pin and capacitor ref; VDD_A1 pin5 and VDD_A2 pin9 must not
    satisfy one another. C_LDO_D owns both32/33. The sixteen C_ADC_CM capacitors belong at their ADC input terminals, while each15nF differential
    filter stays in its AN0556 feedback cell ahead of isolation.
  - 'Small FILT ceramics have priority over470uF reservoirs: 1uF then10uF then470uF, corresponding to the retained July2025 guidelines Fig9 priority
    after DC-bias-aware value adoption. Reservoirs use15mm center ceilings; resistors feed the reservoir side. VMID returns need a deliberate
    nearest GND_A connection; preserve common ground topology while route review reconciles the finite digital-side ground geometry, distinct
    ground-pin vias and50-ohm digital requirement in those guidelines pp10-12.'
