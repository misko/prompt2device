  notes:
  - Make the VIN-capacitor-GND and SW-inductor-output-capacitor loops compact; keep SW copper no larger than needed.
  - Place the 100nF BST capacitor directly between BST and SW.
  - Route FB from the quiet output-capacitor node and shield it from SW and the inductor.
  - Use an unbroken ground plane and manufacturer-recommended thermal vias/copper.
  - 'Carrier local-placement source 2026-09-08: exact-ref/non-ground-net adjacency is a rotation-aware copper-bounding-box gap, NOT pad-center
    distance or routed length. Rounded engineering ceilings below are not manufacturer numerical maxima. Ground pours are excluded by P-ADJ-PAIR;
    local return/thermal/escape proof remains owed on the later saved PCB.'
  - Source-only pin-center plan uses <=5mm local bypass/BST and <=10mm feedback ceilings, with separately named bulk/input/feed exceptions. See
    01_docs/SOURCE-CORRECTION-20260908-local-placement.md for all 299 roles and exact source geometry; no current-board acceptance is inherited.
  - The three VIN ceramics explicitly own pin3, not the electrically shared EN pin2. BST owns pin6 and SW pin5; existing XGL switch-pad3mm rule
    is unchanged. First output ceramic is local at inductor OUT; additional ceramics and RAW_HOLD are separate10/15mm bulk roles. Fixed-output
    sense pin1 must take the quiet output-capacitor node around, not through, SW copper.
