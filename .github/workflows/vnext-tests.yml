name: vNext portable regressions

on:
  pull_request:
    paths: ['vnext/**', '.github/workflows/vnext-tests.yml']
  push:
    paths: ['vnext/**', '.github/workflows/vnext-tests.yml']

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify imported file identities
        working-directory: vnext
        run: sha256sum --check IMPORT-SHA256SUMS
      - name: Control, handoff and sourcing regressions (no CAD acceptance)
        working-directory: vnext/tools
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest
          test_exploration test_progress test_parent_lifecycle
          test_work_lifecycle test_resume_window test_process_handoffs
          test_stock_lookup
